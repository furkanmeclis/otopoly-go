# Checks only — iOS builds and TestFlight uploads run on Xcode Cloud.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: i18n keys
        run: node scripts/check-i18n.mjs
      - name: Mock API smoke tests (all suites)
        run: npm run test:smoke
      - name: API contract (mock + services vs Go OpenAPI)
        run: npm run test:contract
      - name: Expo config
        run: npx expo config --type public > /dev/null
