# CircleCI port of .github/workflows/ci.yml and mobile-release.yml.
#
# While GitHub Actions is still on, the two jobs with side effects stay off:
#   mobile-release runs only when CIRCLECI_MOBILE_RELEASE_ENABLED=true
#   auto-pr        runs only when CIRCLECI_AUTO_PR_ENABLED=true
# Both are project environment variables (Project Settings -> Environment
# Variables). Turn them on only after ci.yml is disabled, or each push would
# be released / merged twice.
#
# Other project environment variables:
#   EXPO_TOKEN  mobile-release (EAS)
#   GH_TOKEN    fine-grained PAT, Contents + Pull requests read/write:
#               auto-pr opens and merges PRs, mobile-release pushes ios-build-* tags
version: 2.1

parameters:
  # Manual mobile release (GitHub's workflow_dispatch): trigger a pipeline with
  # mobile_release=true. Only a dry run may start from a branch other than main.
  mobile_release:
    type: boolean
    default: false
  platform:
    type: enum
    enum: [all, ios, android]
    default: all
  force_build:
    type: boolean
    default: false
  dry_run:
    type: boolean
    default: true

executors:
  go:
    docker:
      - image: cimg/go:1.26-node
  node:
    docker:
      - image: cimg/node:22.14

commands:
  install-sqlc:
    steps:
      - run:
          name: Install sqlc 1.31.1
          command: |
            curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin sqlc
            sqlc version

  # Same rules as the "changes" job in ci.yml. Exports MOBILE_CHANGED and
  # MOBILE_RELEASE through $BASH_ENV for later steps.
  detect-changes:
    steps:
      - run:
          name: Changed areas
          command: |
            git fetch --quiet origin main || true
            mobile=false; mobile_release=false; base=""
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              before="<< pipeline.git.base_revision >>"
              if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then base="$before"; fi
            else
              base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            fi
            # Unknown range: run the checks, but never ship on a guess.
            files=""
            if [ -n "$base" ]; then files="$(git diff --name-only "$base" HEAD)"; else mobile=true; fi
            while IFS= read -r f; do
              case "$f" in
                backend/docs/openapi.yaml|.easignore|scripts/ci/mobile-release.sh|.github/workflows/*|.circleci/*) mobile=true ;;
                mobile/*.md|mobile/docs/*|mobile/.claude/*|mobile/LICENSE|mobile/scripts/contract/*|mobile/scripts/smoke/*) mobile=true ;;
                mobile/*) mobile=true; mobile_release=true ;;
              esac
            done \<<<"$files"
            if [ "$CIRCLE_BRANCH" != "main" ]; then mobile_release=false; fi
            echo "mobile=$mobile mobile_release=$mobile_release"
            echo "export MOBILE_CHANGED=$mobile MOBILE_RELEASE=$mobile_release" >> "$BASH_ENV"

  mobile-npm-install:
    steps:
      - restore_cache:
          keys:
            - npm-mobile-v1-{{ checksum "mobile/package-lock.json" }}
      - run:
          name: Install
          working_directory: mobile
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-mobile-v1-{{ checksum "mobile/package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  backend:
    executor: go
    environment:
      # cimg/go has no 1.26.11 image yet; pin the toolchain so the build never
      # runs on a release vulnerable to GO-2026-6859 (CVE-2026-97054).
      GOTOOLCHAIN: go1.26.11
    steps:
      - checkout
      - run:
          name: Go toolchain
          working_directory: backend
          command: |
            go version
            go version | grep -q 'go1\.26\.11 ' || { echo "expected go1.26.11"; exit 1; }
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "backend/go.sum" }}
      - install-sqlc
      - run:
          name: sqlc generate
          working_directory: backend
          command: sqlc generate
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin"
            golangci-lint version
      - run:
          name: golangci-lint
          working_directory: backend
          command: golangci-lint run --timeout 5m
      - run:
          name: Test
          working_directory: backend
          command: |
            mkdir -p ~/test-results/go
            gotestsum --junitfile ~/test-results/go/junit.xml -- ./...
      - save_cache:
          key: go-mod-v1-{{ checksum "backend/go.sum" }}
          paths:
            - ~/go/pkg/mod
            - ~/.cache/go-build
      - run:
          name: OpenAPI lint
          working_directory: backend
          command: npx --yes @redocly/cli@1 lint docs/openapi.yaml
      - store_test_results:
          path: ~/test-results

  frontend:
    executor: node
    steps:
      - checkout
      - run:
          name: Install pnpm 11.22.0
          command: sudo npm install -g pnpm@11.22.0
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "frontend/pnpm-lock.yaml" }}
      - run:
          name: Install
          working_directory: frontend
          command: |
            pnpm config set store-dir ~/.pnpm-store
            pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "frontend/pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Typecheck
          working_directory: frontend
          command: pnpm typecheck
      - run:
          name: Lint
          working_directory: frontend
          command: pnpm lint
      - run:
          name: Business-day helpers
          working_directory: frontend
          command: pnpm test:dates
      - run:
          name: i18n
          command: node scripts/check-i18n.mjs

  # Expo app checks. Halts green when nothing mobile-related changed.
  mobile:
    executor: node
    steps:
      - checkout
      - detect-changes
      - run:
          name: Skip when mobile is unchanged
          command: |
            if [ "$MOBILE_CHANGED" != "true" ]; then
              echo "No mobile changes; skipping."
              circleci-agent step halt
            fi
      - mobile-npm-install
      - run:
          name: Lint
          working_directory: mobile
          command: npm run lint
      - run:
          name: Typecheck
          working_directory: mobile
          command: npm run typecheck
      - run:
          name: i18n keys
          working_directory: mobile
          command: node scripts/check-i18n.mjs
      - run:
          name: Mock API smoke tests
          working_directory: mobile
          command: npm run test:smoke
      - run:
          name: API contract
          working_directory: mobile
          command: npm run test:contract
      - run:
          name: Generated API files are up to date
          working_directory: mobile
          command: |
            npm run api:generate
            git diff --exit-code -- src/api/generated
            tail -n +3 scripts/contract/openapi.yaml | diff -q - ../backend/docs/openapi.yaml \
              || { echo "Run scripts/contract/refresh-spec.sh in mobile/"; exit 1; }
      - run:
          name: Expo config
          working_directory: mobile
          command: npx expo config --type public > /dev/null
      - run:
          name: Release script syntax
          command: bash -n scripts/ci/mobile-release.sh

  # Port of mobile-release.yml. Decision logic is in scripts/ci/mobile-release.sh.
  mobile-release:
    executor: node
    parameters:
      manual:
        type: boolean
        default: false
      platform:
        type: enum
        enum: [all, ios, android]
        default: all
      force_build:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    environment:
      # Same values as the Xcode Cloud workflow; the iOS fingerprint must match it.
      EXPO_PUBLIC_APP_ENV: production
      EXPO_UPDATES_CHANNEL: production
    steps:
      - checkout
      - when:
          condition: << parameters.manual >>
          steps:
            - run:
                name: Manual release gate
                command: |
                  if [ "$CIRCLE_BRANCH" != "main" ] && [ "<< parameters.dry_run >>" != "true" ]; then
                    echo "Only a dry run may start from a branch other than main."
                    exit 1
                  fi
      - unless:
          condition: << parameters.manual >>
          steps:
            - detect-changes
            - run:
                name: Automatic release gate
                command: |
                  if [ "${CIRCLECI_MOBILE_RELEASE_ENABLED:-}" != "true" ]; then
                    echo "CIRCLECI_MOBILE_RELEASE_ENABLED is not true; skipping."
                    circleci-agent step halt
                  elif [ "$MOBILE_RELEASE" != "true" ]; then
                    echo "No shipping change under mobile/; skipping."
                    circleci-agent step halt
                  fi
      - run:
          name: Check secrets
          command: |
            [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is not set"; exit 1; }
            if [ "<< parameters.dry_run >>" != "true" ] && [ -z "${GH_TOKEN:-}" ]; then
              echo "GH_TOKEN is not set (needed to push ios-build-* tags)"; exit 1
            fi
      - mobile-npm-install
      - run:
          name: Release
          environment:
            PLATFORM: << parameters.platform >>
            FORCE_BUILD: << parameters.force_build >>
            DRY_RUN: << parameters.dry_run >>
          command: |
            if [ -n "${GH_TOKEN:-}" ]; then
              git remote set-url --push origin \
                "https://x-access-token:${GH_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            fi
            scripts/ci/mobile-release.sh

  # Port of the auto-pr job: feature branch green -> open (or reuse) a PR into
  # main and merge it. Opt out per push with [no-automerge] in the commit message.
  auto-pr:
    executor: node
    environment:
      BASE: main
    steps:
      - checkout
      - run:
          name: Gate
          command: |
            if [ "${CIRCLECI_AUTO_PR_ENABLED:-}" != "true" ]; then
              echo "CIRCLECI_AUTO_PR_ENABLED is not true; skipping."
              circleci-agent step halt; exit 0
            fi
            if git log -1 --format=%B "$CIRCLE_SHA1" | grep -qF "[no-automerge]"; then
              echo "[no-automerge] in the head commit; skipping."
              circleci-agent step halt; exit 0
            fi
            [ -n "${GH_TOKEN:-}" ] || { echo "GH_TOKEN is not set"; exit 1; }
      - run:
          name: Install gh
          command: |
            curl -fsSL "https://github.com/cli/cli/releases/download/v2.63.0/gh_2.63.0_linux_amd64.tar.gz" \
              | tar -xz -C /tmp
            sudo mv /tmp/gh_2.63.0_linux_amd64/bin/gh /usr/local/bin/gh
            gh --version
      - run:
          name: Open or reuse pull request, then merge
          command: |
            export GH_REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            BRANCH="$CIRCLE_BRANCH"
            ahead="$(gh api "repos/$GH_REPO/compare/$BASE...$CIRCLE_SHA1" --jq '.ahead_by')"
            if [ "$ahead" = "0" ]; then
              echo "Branch has nothing that is not already in $BASE; skipping."
              exit 0
            fi
            number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$number" ]; then
              title="$(git log -1 --format=%s "$CIRCLE_SHA1")"
              url="$(gh pr create --base "$BASE" --head "$BRANCH" --title "$title" \
                --body "Otomatik açıldı: \`$BRANCH\` dalında CI başarılı. Zorunlu kontroller geçince \`$BASE\`'e birleşir.")"
              number="${url##*/}"
            fi
            # Only merge the commit this pipeline tested.
            gh pr merge "$number" --merge --match-head-commit "$CIRCLE_SHA1"

workflows:
  ci:
    when:
      not: << pipeline.parameters.mobile_release >>
    jobs:
      - backend
      - frontend
      - mobile
      - mobile-release:
          serial-group: << pipeline.project.slug >>/mobile-release
          requires: [backend, frontend, mobile]
          filters:
            branches:
              only: main
      - auto-pr:
          requires: [backend, frontend, mobile]
          filters:
            branches:
              ignore: [main, master]

  mobile-release-manual:
    when: << pipeline.parameters.mobile_release >>
    jobs:
      - mobile-release:
          serial-group: << pipeline.project.slug >>/mobile-release
          manual: true
          platform: << pipeline.parameters.platform >>
          force_build: << pipeline.parameters.force_build >>
          dry_run: << pipeline.parameters.dry_run >>
