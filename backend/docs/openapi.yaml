    AIConversation:
      type: object
      required: [uuid, title, message_count, last_message_preview, last_message_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        title: { type: string }
        message_count: { type: integer }
        last_message_preview:
          type: string
          maxLength: 121
          description: |
            Plain-text excerpt (markdown stripped, single line, up to 120
            characters plus `…`) of the last user or assistant text message;
            `""` when the conversation has no text yet. A turn without text
            (only tool activity or an error) keeps the previous preview.
        last_message_at:
          type: [string, "null"]
          format: date-time
          description: Time of the last stored message; null for an empty conversation
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AIChartSeries:
      type: object
      required: [key, label]
      properties:
