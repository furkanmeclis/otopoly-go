              $ref: "#/components/schemas/CreatePlatformUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
