        "200":
          description: OK
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/public/quotes/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: Share token from the quote link (not the uuid)
        schema: { type: string, minLength: 43, maxLength: 43 }
    post:
      tags: [Public]
      operationId: acceptPublicQuote
      summary: Customer accepts the quote
      description: No auth. Records IP, user agent and time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicQuoteDecisionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicQuote"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/public/quotes/{token}/reject:
    parameters:
      - name: token
        in: path
        required: true
        description: Share token from the quote link (not the uuid)
        schema: { type: string, minLength: 43, maxLength: 43 }
    post:
      tags: [Public]
      operationId: rejectPublicQuote
      summary: Customer rejects the quote
      description: No auth. Records IP, user agent and time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicQuoteDecisionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicQuote"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenant/catalog/products/{uuid}/summary:
    get:
      tags: [Tenant]
      operationId: getTenantCatalogProductSummary
      summary: Product 360 summary
      description: |
        Stock, pricing / margin and, per the caller's permissions, sales
        (tenant.sales.read), purchases (tenant.purchases.read) and job usage
        (tenant.jobs.read) aggregates of a product. Blocks the caller cannot
        read are null. The monthly trend covers the last 12 months (UTC).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeProductSummary"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/catalog/products/{uuid}/movements:
    get:
      tags: [Tenant]
      operationId: listTenantCatalogProductMovements
      summary: Product stock ledger
      description: |
        Purchases (+), sales (-) and job consumptions (-) of a product, newest
        first. Each kind is included only with its read permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeProductMovementList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/catalog/services/{uuid}/summary:
    get:
      tags: [Tenant]
      operationId: getTenantCatalogServiceSummary
      summary: Service 360 summary
      description: |
        Price vs recipe cost and, with tenant.jobs.read, usage on jobs (count,
        revenue, average job duration, 12-month trend).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Service summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServiceSummary"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/catalog/services/{uuid}/jobs:
    get:
      tags: [Tenant]
      operationId: listTenantCatalogServiceJobs
      summary: Jobs that used a service
      description: Requires tenant.catalog.read and tenant.jobs.read. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServiceJobList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customers/{uuid}/summary:
    get:
      tags: [Tenant]
      operationId: getTenantCustomerSummary
      summary: Customer 360 summary
      description: |
        Vehicles, jobs (tenant.jobs.read), product sales (tenant.sales.read),
        quotes (tenant.quotes.read) and leads (tenant.leads.read) of a
        customer. Blocks the caller cannot read are null; total_spend sums the
        readable blocks.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Customer summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerSummary"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/suppliers/{uuid}/summary:
    get:
      tags: [Tenant]
      operationId: getTenantSupplierSummary
      summary: Supplier 360 summary
      description: Purchase aggregates, top products and recent purchases (tenant.purchases.read; null otherwise).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Supplier summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSupplierSummary"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/mcp/info:
    get:
      tags: [MCP]
      operationId: getMCPInfo
      summary: MCP server URLs for the connect guides
      description: |
        Public URLs of the two MCP endpoints (docs/MCP.md) and whether the
        caller may connect them (`tenant.mcp.connect` / `platform.mcp.connect`).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: MCP info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMCPInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/mcp/oauth/requests/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [MCP]
      operationId: getMCPOAuthRequest
      summary: Consent screen data of a pending MCP authorization request
      description: |
        The client, its redirect host, the endpoint (`/mcp/org` or
        `/mcp/platform`), the requested scopes and, for `/mcp/org`, the
        organizations the user may bind the connection to (active membership,
        `tenant.mcp.connect`, plan toggle `mcp.enabled`) with the tool count
        there. `allowed` is false when the user cannot approve.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Consent data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMCPConsent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/mcp/oauth/requests/{uuid}/decide:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [MCP]
      operationId: decideMCPOAuthRequest
      summary: Approve or deny a pending MCP authorization request
      description: |
        Approve binds the connection to `organization_uuid` (required for
        `/mcp/org`) with the chosen `scopes` (a subset of the requested ones;
        omitted = all). The request is consumed either way; the response is
        where to send the browser (the client's redirect URI with `code` or
        `error=access_denied`, plus `state` and `iss`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPDecideRequest" }
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMCPDecision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/mcp/grants:
    get:
      tags: [MCP]
      operationId: listMCPGrants
      summary: The current user's connected MCP apps
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: realm
          in: query
          schema: { type: string, enum: [org, platform] }
        - name: organization_uuid
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Connected apps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMCPGrantList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/mcp/grants/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    delete:
      tags: [MCP]
      operationId: revokeMCPGrant
      summary: Disconnect one of the user's MCP apps
      description: Revokes the grant and every token issued under it at once.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/mcp/clients:
    get:
      tags: [MCP]
      operationId: listPlatformMCPClients
      summary: Registered MCP (OAuth) clients
      description: Requires `platform.mcp.manage`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked] }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMCPClientList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/mcp/clients/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    delete:
      tags: [MCP]
      operationId: revokePlatformMCPClient
      summary: Block an MCP client
      description: |
        Requires `platform.mcp.manage`. Revokes the client, every grant and
        token issued to it, pending requests and unused codes. Blocking a
        blocked client again succeeds.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Blocked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SmsProviderPath:
      name: provider
      in: path
      required: true
      description: SMS provider code
      schema: { type: string, enum: [netgsm, twilio] }
    LegalPageSlug:
      name: slug
      in: path
      required: true
      description: Legal page slug (e.g. `privacy`)
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 64, example: privacy }
    QRSessionID:
      name: id
      in: path
      required: true
      description: QR sign-in session id (from the QR URL)
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }
    VehicleCatalogBrandFilter:
      name: brand
      in: query
      description: Brand UUID
      schema: { type: string, format: uuid }

    VehicleCatalogCategory:
      name: category
      in: query
      schema: { $ref: "#/components/schemas/VehicleCatalogBrandCategory" }

    VehicleCatalogDisplayBrandFilter:
      name: display_brand
      in: query
      description: Display brand UUID (every TSB brand mapped to it)
      schema: { type: string, format: uuid }

    VehicleCatalogYear:
      name: year
      in: query
      description: Model year
      schema: { type: integer, minimum: 1950, maximum: 2100 }

    VehicleCatalogLogoVariant:
      name: variant
      in: query
      description: Logo variant. Default = full logo (upload first), `badge` = emblem, `wordmark` = text-only.
      schema: { type: string, enum: [badge, wordmark, full] }

    XOrganization:
      name: X-Organization
      in: header
      required: true
      description: |
        Organization of a `/v1/tenant/*` request: its slug (preferred, readable
        in logs) or uuid. The BFF forwards it on `/api/v1/tenant/*` only.
      schema: { type: string, maxLength: 64, example: acme }

  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LimitReached:
      description: |
        `LIMIT_REACHED` — a hard plan limit is exhausted. `error.details` is a
        list of `{field, message}` pairs whose `message` is a string value:
        `feature` (feature key, e.g. `jobs.daily`), `limit`, `used`,
        `tolerance` (integers as strings; `storage.gb` in MB) and
        `owner_notified` (`"true"` | `"false"`: the organization owner has been
        e-mailed and got an in-app notice about this limit in the current
        billing period). Clients show role-based text (owner: "upgrade on the
        web"; staff: "your manager has been notified" when `owner_notified`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            error:
              code: LIMIT_REACHED
              message: Plan limit reached
              details:
                - { field: feature, message: jobs.daily }
                - { field: limit, message: "10" }
                - { field: used, message: "10" }
                - { field: tolerance, message: "10" }
                - { field: owner_notified, message: "true" }
            meta: { request_id: "7b1d2c1e-3f0a-4c55-9d7e-2f1c0b9a8e11" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TenantForbidden:
      description: |
        `NO_TENANT_MEMBERSHIP` (unknown organization or not a member),
        `ORGANIZATION_SUSPENDED`, `ORGANIZATION_ACCESS_EXPIRED`, `FORBIDDEN`
        (tenant permission missing in this organization), or
        `FEATURE_NOT_ENABLED` (TEC-674) on a change in a plan-gated area (site,
        public API, channel managers, KABİS retry, HGS, e-invoice sending,
        WhatsApp, SMS, integration accounts / job retries of those providers)
        when the organization's plan does not include the feature;
        `details[0].code` names the feature key. Reads (lists, details,
        exports) and switching things off stay open on every plan, so history
        never disappears after a downgrade
        `SUPPORT_GRANT_REQUIRED` (TEC-678): an impersonated (support) session
        and the organization has no active support access grant;
        `SUPPORT_READ_ONLY`: a non-GET request under a `read_only` grant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"


  schemas:

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        tenant_scoped: { type: boolean }

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PushDeviceInput:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: Expo push token (`ExponentPushToken[...]` or `ExpoPushToken[...]`)
          example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
        platform: { type: string, enum: [ios, android] }
        locale:
          type: string
          description: Device locale (`tr`, `en`, `tr-TR`, ...); stored as `tr` | `en` | empty
          example: tr-TR
        app_version: { type: string, maxLength: 32, example: "1.4.0 (57)" }
        device_name: { type: string, maxLength: 120, example: "iPhone 16" }

    PushDevice:
      type: object
      required: [uuid, token, platform, locale, app_version, device_name, last_seen_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        token: { type: string }
        platform: { type: string, enum: [ios, android] }
        locale: { type: string, enum: [tr, en, ""] }
        app_version: { type: string }
        device_name: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    PushDeviceRegistration:
      type: object
      required: [device, push_enabled]
      properties:
        device: { $ref: "#/components/schemas/PushDevice" }
        push_enabled:
          type: boolean
          description: Current `push_enabled` preference of the user

    EnvelopePushDeviceRegistration:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PushDeviceRegistration" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeStatusOK:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok] }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    LiveActivityDeviceInput:
      type: object
      additionalProperties: false
      required: [device_token]
      properties:
        device_token:
          type: string
          description: The device's Expo push token (registered with POST /v1/push-devices)
          example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
        push_to_start_token:
          type: string
          description: iOS 17.2+ ActivityKit push-to-start token (hex); empty clears it
        widgets:
          type: boolean
          default: true
          description: false keeps the link (push-to-start token) without widget pushes

    LiveActivityDevice:
      type: object
      required: [widgets_enabled, push_to_start, live_activity_push]
      properties:
        widgets_enabled: { type: boolean }
        push_to_start: { type: boolean, description: A push-to-start token is stored }
        live_activity_push: { type: boolean, description: The server can update iOS Live Activities (APNs configured) }

    EnvelopeLiveActivityDevice:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/LiveActivityDevice" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    LiveActivityInput:
      type: object
      additionalProperties: false
      required: [platform, activity_id]
      properties:
        platform: { type: string, enum: [ios, android] }
        activity_id:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9._:\\-]{1,128}$"
          description: ActivityKit activity id (iOS) or the job uuid (Android)
        push_token:
          type: string
          description: iOS per-activity ActivityKit push token (hex); required on iOS
        device_token:
          type: string
          description: Expo push token of this device; required on Android
        locale:
          type: string
          description: Device language (tr / en); the user's language wins
          example: tr

    LiveActivity:
      type: object
      required: [uuid, job_uuid, platform, activity_id, expires_at, remote_updates]
      properties:
        uuid: { type: string, format: uuid }
        job_uuid: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        activity_id: { type: string }
        expires_at: { type: string, format: date-time }
        remote_updates:
          type: boolean
          description: false when the server cannot update this activity (iOS without APNs key); the app keeps updating it in the foreground

    EnvelopeLiveActivity:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/LiveActivity" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
            - MFA_REQUIRED
            - INVALID_MFA_CODE
            - RATE_LIMITED
            - STEP_UP_REQUIRED
            - ACCOUNT_DEACTIVATED
            - INVALID_EMAIL_CODE
            - INVALID_ID_TOKEN
            - OAUTH_ACCOUNT_NOT_LINKED
            - OAUTH_LINK_CHOICE_REQUIRED
            - INVALID_LINK_TICKET
            - OAUTH_PROVIDER_DISABLED
            - CANNOT_DELETE_SELF
            - LAST_SUPER_ADMIN
            - SOLE_ORGANIZATION_OWNER
            - LAST_ORGANIZATION_OWNER
            - EMAIL_IN_USE
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          type: string
          enum: [tr, en]
          default: tr
        deleted_at:
          type: [string, "null"]
