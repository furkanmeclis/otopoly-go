  /v1/tenant/calendar/feed:
    get:
      tags: [Tenant]
      operationId: getTenantCalendarFeed
      summary: Calendar feed (own events + live module layers)
      description: >-
        Requires `tenant.calendar.read`. Returns the organization's events and
        dated records from other modules overlapping [from, to) (dates in
        Europe/Istanbul, `to` exclusive, at most 62 days). Layers the member may
        not read (module permission or plan) are left out silently; requesting
        an unknown layer is a 400.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-10-01" }
        - name: to
          in: query
          required: true
          description: Exclusive end date.
          schema: { type: string, format: date, example: "2026-11-01" }
        - name: layers
          in: query
          description: Comma-separated layers; empty means every layer the caller may see.
