      tags: [Platform]
      operationId: restorePlatformUser
      summary: Restore a deleted platform user
      description: |
        Requires `platform.users.delete` and step-up verification. Clears `deleted_at`
        when the email is still free (`409 EMAIL_IN_USE` otherwise; `409 CONFLICT` when the
        user is not deleted). Sessions, push devices, OAuth identities and passkeys removed
        by the deletion are not restored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Restored user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

