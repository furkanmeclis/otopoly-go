openapi: 3.1.0
info:
  title: App API
  version: 0.1.0
  summary: Boilerplate HTTP API — auth, RBAC, users, roles, notifications, realtime
  description: |
    Starter HTTP API for the Next.js + Go boilerplate.

    **In scope:** authentication, global RBAC, platform users/roles, notifications,
    Web Push (VAPID), passkeys, and Centrifugo realtime tokens.

    **Out of scope:** tenants, workspaces, CRM, inbox, commerce, AI, tickets, reports.
    Those product modules were stripped. Live Go routes (`internal/modules/**/routes.go`)
    are the source of truth if a path below is missing from the router.

    **Roles:**
    - `super_admin` — system role; assigned via `make create-super-admin`
    - `organization_user` — system role for business owners/staff
    - Custom roles via `/v1/platform/roles`

    **Auth:** Bearer JWT access tokens + opaque refresh tokens.
    See `docs/auth.md` for the permission matrix and token claims.
    Error catalog: `docs/api/errors.md`.

    **Conventions:**
    - Success/error envelope: `{success,data|error,meta.request_id}` on all `/v1/*`.
    - Lists: `{items,total,limit,offset}` under `data` (`limit`/`offset`/`q`/`sort`; never `page`/`search`).
    - Probes `/healthz` and `/readyz` are **not** enveloped.
    - See `API_CONVENTIONS.md` and `docs/api/errors.md`.
  contact:
    name: App
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://127.0.0.1:8080
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Register, login, tokens, sessions, profile
  - name: Search
    description: Command-palette search (Meilisearch-backed record lookup)
  - name: Platform
    description: Super-admin platform tenant/user catalog
  - name: Realtime
    description: Centrifugo connection and subscription tokens
  - name: Notifications
    description: In-app notification center, preferences, and admin send
  - name: MCP
    description: Remote MCP server OAuth consent, connected apps and client management (docs/MCP.md)

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Process is alive. Does not check dependencies.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Pings Postgres and Redis. Returns 200 when both are up, 503 otherwise.
        Object storage is a soft check (logged only).
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: postAuthRegister
      summary: Self-serve user register
      description: |
        Creates a global user account and returns it. Tokens are issued on login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRegister"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: Login
      description: |
        Authenticates with email/password and returns a token pair.
        A self-deleted account returns `403 ACCOUNT_DEACTIVATED` (after the
        password is verified); `/v1/auth/refresh` and every other sign-in path
        do the same.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/organizations:
    post:
      tags: [Auth]
      operationId: postAuthOrganizations
      summary: Create my business
      description: |
        Self-serve business creation for a signed-in user that has no business
        yet (typically after Apple / Google / email-code sign-up, which create
        a user without an organization). No organization context is required.

        Same organization setup as `/v1/public/organizations/register`: the
        caller becomes `owner` (organization_user + organization_owner roles),
        a slug is generated from the name, and a 14-day trial starts now
        (`access_starts_at` = now, `access_ends_at` = now + trial). Runs in one
        transaction.

        The response carries no tokens: call `/v1/auth/organization-context`
        with the returned `slug` (or `/v1/auth/refresh`) to get an
        organization-scoped session.

        Optional `sector` (business type: `car_wash`, `detailing`,
        `ppf_tint`, `auto_service`, `tyres`, `other`) is stored on the
        organization and returned here, on `/v1/auth/me` organizations and on
        `/v1/tenant/settings`.

        Errors: `400 VALIDATION_ERROR` (field details: `organization_name`
        2-120 characters; `phone` <= 32, `city` / `district` <= 100,
        `address` <= 500, `sector` one of the values above), `401`, `403 FORBIDDEN` when self-registration is
        disabled (`auth_settings.registration_enabled`), `409 CONFLICT` when
        the caller already owns a business (staff membership elsewhere does not
        count), `429 RATE_LIMITED` (5 per hour per user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnedOrganizationRequest"
      responses:
        "201":
          description: Business created; caller is its owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOwnedOrganizationCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/organization-context:
    post:
      tags: [Auth]
      operationId: postAuthOrganizationContext
      summary: Switch organization context
      description: |
        Re-issues access and refresh tokens with the JWT `oid` claim set for the
        given organization. Requires an authenticated session and active membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextRequest"
      responses:
        "200":
          description: Organization context applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: postAuthRefresh
      summary: Refresh tokens
      description: Rotates an opaque refresh token and returns a new token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: Logout
      description: Revokes the given refresh token. Requires a valid access JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Current session
      description: Hydrates the authenticated user, roles, permissions, and tenant memberships.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search/specs:
    get:
      tags: [Search]
      operationId: getSearchSpecs
      summary: Searchable resource specs
      description: Returns Meilisearch-backed specs visible to the caller (permission-filtered).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Spec catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchSpecs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search:
    get:
      tags: [Search]
      operationId: getSearch
      summary: Search indexed records
      description: Typo-tolerant search across allowed specs. Use `q` (not `search`). Optional `spec` scopes to one resource.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: spec
          in: query
          schema:
            type: string
            example: users
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchHits"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up:
    get:
      tags: [Auth]
      operationId: getAuthStepUp
      summary: Step-up grant status
      description: Returns whether the caller has a recent step-up grant and enabled verification methods.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Step-up status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/password:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPassword
      summary: Verify password for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpPasswordRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/options:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyOptions
      summary: Begin passkey step-up assertion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/verify:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyVerify
      summary: Finish passkey step-up assertion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/totp:
    post:
      tags: [Auth]
      operationId: postAuthStepUpTOTP
      summary: Verify authenticator code for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp:
    get:
      tags: [Auth]
      operationId: getAuthTOTP
      summary: Authenticator 2FA status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/setup:
    post:
      tags: [Auth]
      operationId: postAuthTOTPSetup
      summary: Begin authenticator 2FA setup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Setup secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: postAuthTOTPConfirm
      summary: Confirm authenticator 2FA setup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Confirmed with recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPConfirm"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: postAuthTOTPDisable
      summary: Disable authenticator 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/access/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAccessSettings
      summary: Read step-up policy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformAccessSettings
      summary: Update step-up policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStepUpPolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/github:
    get:
      tags: [Platform]
      operationId: getPlatformGitHubIntegrationSettings
      summary: Read GitHub App integration settings
      description: Super admin only. Secrets are never returned; only configured flags.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformGitHubIntegrationSettings
      summary: Update GitHub App integration settings
      description: Super admin only. Omit blank secret fields to keep existing values.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGitHubIntegrationSettingsRequest"
      responses:
        "200":
          description: Updated GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp:
    get:
      tags: [Platform]
      operationId: getPlatformWhatsAppIntegrationSettings
      summary: Read platform WhatsApp sender settings
      description: >-
        Super admin only (`platform.integrations.whatsapp.read`). Secrets are never
        returned; only `*_configured` flags. Includes the public webhook URL for Meta.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform WhatsApp sender settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformWhatsAppIntegrationSettings
      summary: Update platform WhatsApp sender settings
      description: >-
        Super admin only (`platform.integrations.whatsapp.write`). Partial update;
        omitted or blank secret fields keep the stored values. Selecting the `cloud`
        provider requires `phone_number_id` and an access token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWhatsAppIntegrationSettingsRequest"
      responses:
        "200":
          description: Updated platform WhatsApp sender settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppIntegrationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/test:
    post:
      tags: [Platform]
      operationId: postPlatformWhatsAppTest
      summary: Send a test message from the platform number
      description: >-
        Super admin only (`platform.integrations.whatsapp.write`). Uses the configured
        provider: Cloud sends `hello_world` (or the given catalog template with its
        example values), whatsmeow sends a plain test line (or the catalog text).
        Sender / Meta failures return 409 with the classified error code
        (e.g. `CLOUD_AUTH_FAILED`, `PLATFORM_SENDER_NOT_CONFIGURED`, `GRAPH_100`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformWhatsAppTestRequest"
      responses:
        "200":
          description: Test message accepted by the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlatformWhatsAppTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/session/connect:
    post:
      tags: [Platform]
      operationId: postPlatformWhatsAppSessionConnect
      summary: Start QR pairing of the platform whatsmeow number
      description: >-
        Super admin only (`platform.integrations.whatsapp.write`). Pairing runs in the
        background; poll `GET /v1/platform/integrations/whatsapp` for
        `whatsmeow_qr_code` while `whatsmeow_status` is `qr_pending` (same polling
        flow as the tenant session).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings with the pairing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppIntegrationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/session:
    delete:
      tags: [Platform]
      operationId: deletePlatformWhatsAppSession
      summary: Disconnect the platform whatsmeow number
      description: Super admin only (`platform.integrations.whatsapp.write`). Logs the device out.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings after disconnect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/templates:
    get:
      tags: [Platform]
      operationId: getPlatformWhatsAppTemplates
      summary: Platform template catalog with Meta status
      description: >-
        Super admin only (`platform.integrations.whatsapp.read`). Every catalog entry
        (code) merged with its stored Meta state (status, ids, override name).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Template catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppTemplateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/templates/submit:
    post:
      tags: [Platform]
      operationId: postPlatformWhatsAppTemplatesSubmit
      summary: Submit catalog templates to Meta
      description: >-
        Super admin only (`platform.integrations.whatsapp.write`). Creates every
        `not_submitted` template (every catalog language, or only `keys` ×
        `languages`) in the WABA with example values; `rejected` templates are
        edited in place (Meta reviews them again). Entries with an override name are
        skipped. Per-template failures are reported in `results` with Meta's error
        text; auth / configuration failures return 409.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWhatsAppTemplatesRequest"
      responses:
        "200":
          description: Submit results and the updated catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppTemplateSubmit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/templates/sync:
    post:
      tags: [Platform]
      operationId: postPlatformWhatsAppTemplatesSync
      summary: Pull template statuses from Meta
      description: >-
        Super admin only (`platform.integrations.whatsapp.write`). Matches Meta
        templates by effective name (override or catalog name) and language, for every
        catalog language; templates missing in Meta become `not_submitted`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated template catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppTemplateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/whatsapp/templates/{key}/{language}:
    patch:
      tags: [Platform]
      operationId: patchPlatformWhatsAppTemplate
      summary: Set or clear the Meta template name override
      description: >-
        Super admin only (`platform.integrations.whatsapp.write`). Maps a catalog key
        in one language to a template created manually in Meta (`null` / empty clears
        it). The stored Meta state of that language is reset to `not_submitted` until
        the next sync.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, examples: ["job.ready"] }
        - name: language
          in: path
          required: true
          description: Catalog language (Meta language code).
          schema: { type: string, enum: [tr, en] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWhatsAppTemplateRequest"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

