  /v1/tenant/jobs/{uuid}/loyalty:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Tenant]
      operationId: getTenantJobLoyalty
      summary: Job loyalty section
      description: >-
        Requires `tenant.jobs.read` and `tenant.loyalty.read`. Plan feature `loyalty.enabled` (403 `FEATURE_DISABLED` when off). What is applied,
        what can be applied now (`options`, biggest saving first; only while the job
        is open and unpaid) and the customer's stamp cards.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJobLoyalty"
