      summary: Read Facebook OAuth integration settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Facebook integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOAuthProviderSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformFacebookIntegrationSettings
      summary: Update Facebook OAuth integration settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
