      tags: [Tenant]
      operationId: getTenantTodo
      summary: Get a todo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTodo"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: updateTenantTodo
      summary: Update a todo (empty string clears optional fields)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTodoRequest"
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTodo"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantTodo
      summary: Delete a todo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIDeleted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/todos/{uuid}/complete:
    post:
      tags: [Tenant]
      operationId: completeTenantTodo
      summary: Mark a todo done
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTodo"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/todos/{uuid}/reopen:
    post:
      tags: [Tenant]
      operationId: reopenTenantTodo
      summary: Reopen a done todo
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTodo"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/ai/voice/transcribe:
    post:
      tags: [Tenant]
      operationId: transcribeTenantAIVoice
      summary: Transcribe a push-to-talk clip (Speaches faster-whisper)
      description: |
        Multipart upload with one `file` field (MediaRecorder output: webm/ogg/mp4,
        or wav/mp3/flac), at most 5 MB. Uses the platform STT model and language.
        Requires `tenant.ai.use`, the assistant enabled for the organization and
        the `voice` feature (403 `AI_VOICE_DISABLED`). Clips longer than 120 s are
        rejected (`AUDIO_TOO_LONG`); the UI stops recording at 60 s.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Recognized text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAITranscription"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Audio larger than 5 MB (`AUDIO_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Unsupported audio type (`AUDIO_UNSUPPORTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: Speaches unreachable or failed (`AI_VOICE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenant/ai/voice/speech:
    post:
      tags: [Tenant]
      operationId: synthesizeTenantAIVoice
      summary: Read assistant text aloud (Speaches Piper TTS), streamed as MP3
      description: |
        Markdown is reduced to speakable text server-side (code, tables and link
        targets dropped) and clipped to 2500 characters at a sentence boundary.
        Same gating as transcribe. Voice calls are limited to 60 per user per
        10 minutes (429 `RATE_LIMITED`). Usage is recorded in the AI usage ledger
        (characters for TTS, audio seconds for STT).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISpeechRequest"
      responses:
        "200":
          description: Audio stream
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: Speaches unreachable or failed (`AI_VOICE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/platform/ai/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAISettings
      summary: Read AI assistant settings
      description: Requires `platform.ai.read`. The API key is never returned (`has_api_key` + `api_key_hint`).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAISettings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Platform]
      operationId: patchPlatformAISettings
      summary: Update AI assistant settings
      description: Requires `platform.ai.write`. `api_key` sets or replaces the key (stored encrypted); `clear_api_key` removes it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAISettingsRequest"
      responses:
        "200":
          description: Updated AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAISettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/ai/settings/test:
    post:
      tags: [Platform]
      operationId: testPlatformAISettings
      summary: Test the provider connection with the saved settings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Test result (ok=false carries the provider error message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAITestResult"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/ai/voice/test:
    post:
      tags: [Platform]
      operationId: testPlatformAIVoice
      summary: Check the Speaches server and whether the configured models are installed
      description: |
        Lists installed models (`GET /v1/models` on Speaches). Body fields override
        the saved voice settings so unsaved values can be tested. `ok` is true only
        when both the STT model and the TTS model are installed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIVoiceTestRequest"
      responses:
        "200":
          description: Test result (ok=false carries the reason in message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIVoiceTestResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/ai/usage:
    get:
      tags: [Platform]
      operationId: getPlatformAIUsage
      summary: Token usage and estimated cost per organization for a month
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          description: YYYY-MM (Europe/Istanbul). Defaults to the current month.
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIUsageSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/ai/organizations/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform]
      operationId: getPlatformAIOrganizationSettings
      summary: Per-organization AI switch and monthly token quota
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organization AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIOrgSettings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Platform]
      operationId: putPlatformAIOrganizationSettings
      summary: Replace the per-organization AI override
      description: "`monthly_token_quota`: null inherits the platform default, 0 means unlimited."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAIOrgSettingsRequest"
      responses:
        "200":
          description: Updated organization AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIOrgSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        tenant_scoped: { type: boolean }

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          type: string
          enum: [tr, en]
          default: tr

    MeLinks:
      type: object
      required: [profile, change_password, notification_preferences]
      properties:
        profile: { type: string, examples: ["/v1/auth/profile"] }
        change_password: { type: string, examples: ["/v1/auth/password/change"] }
        notification_preferences: { type: string, examples: ["/v1/notification-preferences"] }

    MeChannels:
      type: object
      properties:
        user:
          type: string
          description: Centrifugo channel hint
          examples: ["user:uuid"]

    MeRealtime:
      type: object
      required: [enabled, user_channel]
      properties:
        enabled: { type: boolean }
        ws_url: { type: string }
        user_channel:
          type: string
          examples: ["user:uuid"]

    Me:
      type: object
      required: [user, roles, permissions, links, channels, realtime]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
        links:
          $ref: "#/components/schemas/MeLinks"
        channels:
          $ref: "#/components/schemas/MeChannels"
        realtime:
          $ref: "#/components/schemas/MeRealtime"
        impersonation:
          $ref: "#/components/schemas/MeImpersonation"

    MeImpersonation:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    OrganizationMembership:
      type: object
      required: [uuid, slug, name, role, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, staff]
        logo_url:
          type: [string, "null"]
        status:
          type: string
        access_ends_at:
          type: [string, "null"]
          format: date-time

    PublicOrganization:
      type: object
      required: [uuid, slug, name, status, access_ok]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
        logo_url:
          type: [string, "null"]
        access_ok:
          type: boolean

    Organization:
      type: object
      required: [uuid, slug, name, city, district, phone, address, status, access_starts_at, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
        plan_code:
          type: [string, "null"]
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: [string, "null"]
          format: date-time
        logo_url:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationRegisterRequest:
      type: object
      required: [name, surname, email, password, organization_name, city, district, phone, address]
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        organization_name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string

    CreatePlatformOrganizationRequest:
      type: object
      required: [name, owner_user_uuid]
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        owner_user_uuid:
          type: string
          format: uuid

    OrganizationRegisterResult:
      type: object
      required: [user, organization, tokens]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        organization:
          $ref: "#/components/schemas/Organization"
        tokens:
          $ref: "#/components/schemas/Tokens"

    SessionSwitch:
      type: object
      required: [user_uuid, email]
      properties:
        user_uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        impersonator_uuid:
          type: string
          format: uuid

    ImpersonationResult:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [session]
          properties:
            session:
              $ref: "#/components/schemas/SessionSwitch"

    RegisterRequest:
      type: object
      required: [email, password, name, surname]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        surname:
          type: string

    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        totp_code:
          type: string
          description: Authenticator or recovery code when 2FA is enabled
          maxLength: 32
        organization_slug:
          type: string
          description: When set, login is scoped to this organization membership

    OrganizationContextRequest:
      type: object
      required: [organization_slug]
      properties:
        organization_slug:
          type: string
          description: Organization slug to scope the active session to

    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32

    TOTPStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        confirmed_at: { type: [string, "null"], format: date-time }

    TOTPSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string }
        otpauth_url: { type: string }

    TOTPConfirm:
      type: object
      required: [enabled, recovery_codes]
      properties:
        enabled: { type: boolean }
        recovery_codes:
          type: array
          items: { type: string }

    EnvelopeTOTPStatus:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPStatus" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTOTPSetup:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPSetup" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTOTPConfirm:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPConfirm" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    CreatePlatformUserRequest:
      type: object
      required: [email, password, name, surname]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        surname: { type: string }
        status: { type: string, examples: [active, pending, disabled] }
        role_uuids:
          type: array
          items: { type: string, format: uuid }

    PatchPlatformUserRequest:
      type: object
      properties:
