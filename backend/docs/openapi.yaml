  /v1/platform/organizations/{uuid}/status:
    post:
      tags: [Platform]
      operationId: setPlatformOrganizationStatus
      summary: Suspend or activate an organization
      description: |
        Requires `platform.organizations.write` and step-up verification
        (`403 STEP_UP_REQUIRED`). Audited as `organizations.suspended` /
        `organizations.activated`; setting the current status again is a no-op.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          description: Organization UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOrganizationStatusRequest" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrganization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/organizations/{uuid}/extend-access:
    post:
      tags: [Platform]
      operationId: extendPlatformOrganizationAccess
      summary: Extend organization access
      description: |
        Requires `platform.organizations.write` and step-up verification
        (`403 STEP_UP_REQUIRED`). Moves `access_ends_at` to max(now, current end) + `days`.
        With a live billing subscription the subscription end moves too (it owns the
        access window). An `expired` organization becomes `active`; a `suspended` one stays
        suspended. Unlimited access (`access_ends_at` null) cannot be extended (400).
        Audited as `organizations.access_extended`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          description: Organization UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtendOrganizationAccessRequest" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrganization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/organizations/{uuid}/logo:
