      tags: [Auth]
      operationId: deleteAuthIdentity
      summary: Unlink an OAuth identity
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, google, facebook, apple]
      responses:
