      summary: Capture on-site signature for a signer slot
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: signerUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
