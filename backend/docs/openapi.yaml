  /v1/tenant/ai/conversations/{uuid}/messages:
    post:
      tags: [Tenant]
      operationId: sendTenantAIMessage
      summary: Send a message and stream the assistant's answer (SSE)
      description: |
        Send with `Accept: text/event-stream`. Availability and quota are checked
        before the stream starts (403 with `AI_DISABLED`, `AI_NOT_CONFIGURED`,
        `FEATURE_DISABLED`, `AI_ORG_DISABLED` or `AI_QUOTA_EXCEEDED`). The response is a
        server-sent event stream; each event's `data` is JSON:

        - `message_start` `{conversation_uuid, user_message_uuid}`
        - `text_delta` `{text}`
        - `tool_start` `{id, name}`
        - `tool_result` `{id, name, ok, summary_key, summary_params}`
        - `chart` `{id, chart: AIChart}`
        - `plan` `{block: AIUIBlock}` (todo_list checklist; replaces the previous one)
        - `confirm` `{block: AIUIBlock}` (write action proposed; the turn pauses until
          `/v1/tenant/ai/actions/{uuid}/confirm` or `/cancel`, or the next message expires it)
        - `error` `{code, message}` (provider_error, quota_exceeded, refusal, max_tokens, internal_error)
        - `message_done` `{message_uuid, status, stop_reason, usage}`
        - `title` `{conversation_uuid, title}` (first exchange only)

        Comment lines (`: ping`) are sent as keep-alives.

        Limits: content at most 8000 characters (400), at most 400 stored messages
        per conversation (409 `AI_CONVERSATION_LIMIT`), and 30 model turns
        (messages + action confirms) per user per 5 minutes (429 `RATE_LIMITED`
        with `Retry-After`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISendMessageRequest"
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Authenticated but not allowed, `FEATURE_DISABLED` when the organization's plan excludes `ai.enabled`, or an AI availability/quota error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`AI_CONVERSATION_LIMIT`: the conversation is too long; start a new one."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenant/ai/actions/{uuid}/confirm:
    post:
      tags: [Tenant]
      operationId: confirmTenantAIAction
      summary: Confirm a pending assistant action and stream the continuation (SSE)
      description: |
        Executes a write action the assistant proposed (confirm card) exactly once,
        with the requesting user's identity and permissions, then feeds the result
        back to the model and streams its continuation. Optional `edits` change the
        card's editable fields (re-validated before execution). Checks run before
        the stream starts: 404 (not the user's action), 403 `AI_ACTION_FORBIDDEN`
        (the user lacks the underlying permission or actions were disabled),
        403 `FEATURE_DISABLED` (the organization's plan excludes `ai.enabled`),
        409 `AI_ACTION_RESOLVED` (already confirmed/cancelled; double confirm),
        409 `AI_ACTION_EXPIRED`, 409 `AI_ACTION_NOT_READY` (the proposing turn is
        still streaming), 400 for invalid edits. Stream events (`data` is JSON):

        - `action` `{action_uuid, status, tool_use_id, block: AIUIBlock}` (confirmed | failed)
        - then, when the assistant is available: `message_start` `{conversation_uuid, resumed: true, action_uuid}`
          followed by the same events as the messages endpoint.

        Only the user who received the card can confirm it (other users and
        organizations get 404). Confirms share the per-user model-turn rate
        limit with messages (429 `RATE_LIMITED`). An action left `executing` by a
        server crash is resolved as `failed` ("outcome unknown") after 10 minutes.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIConfirmActionRequest"
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Authenticated but not allowed, `FEATURE_DISABLED` when the organization's plan excludes `ai.enabled`, or `AI_ACTION_FORBIDDEN`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenant/ai/actions/{uuid}/cancel:
    post:
      tags: [Tenant]
      operationId: cancelTenantAIAction
      summary: Cancel a pending assistant action (nothing is executed)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated confirm card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAIActionBlock"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Authenticated but not allowed, or `FEATURE_DISABLED` when the organization's plan excludes `ai.enabled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

