      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [link, skip, unlink] }
                motomarks_id: { type: string, description: "Required for link", example: fiat }
      responses:
        "200":
          description: Updated display brand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeVehicleCatalogDisplayBrand" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
