        service_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: string, description: The service's current list price }

    LoyaltyPackage:
      type: object
      required: [uuid, name, description, price, currency, is_active, items, list_value, sold_count, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price: { type: string }
        currency: { type: string }
        validity_days: { type: integer, minimum: 1, description: Omitted = never expires }
        is_active: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/LoyaltyPackageItem" } }
        list_value: { type: string, description: Items at the services' current prices }
        sold_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoyaltyPackageInput:
      type: object
      required: [name, price, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string }
        price: { type: string, description: "> 0" }
        currency: { type: string, minLength: 3, maxLength: 3, description: Default TRY }
        validity_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        is_active: { type: [boolean, "null"] }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [service_uuid, quantity]
            properties:
              service_uuid: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 1000 }

    LoyaltyPlan:
      type: object
      required: [uuid, name, description, price, currency, period_months, services, categories, is_active, active_count, created_at, updated_at]
      properties:
