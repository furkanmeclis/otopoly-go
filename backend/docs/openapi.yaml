    get:
      tags: [Public]
      operationId: getPublicVehicleBrandLogo
      summary: Stream a vehicle brand logo
      description: |
        Public, cacheable (`Cache-Control: public, max-age=604800`). This is the
        `logo_url` / `brand_logo_url` returned on vehicles, jobs, quotes, …;
        append `?variant=badge` for the square emblem (app icons, lists).
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: query
          required: false
          description: |
            Which logo file to serve. Omitted / empty or `full`: uploaded logo →
            full → badge → wordmark. `badge`: emblem → uploaded → full.
            `wordmark`: the wordmark only (`404` when there is none). Any other
            value is `400`.
          schema:
            type: string
            enum: [full, badge, wordmark]
      responses:
        "200":
          description: Logo bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
