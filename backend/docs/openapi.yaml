        description: { type: string }
        price: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        period_months: { type: integer, minimum: 1, maximum: 12, description: Default 1 }
        uses_per_period: { type: [integer, "null"], minimum: 1, maximum: 1000, description: null = unlimited }
        service_uuids: { type: array, items: { type: string, format: uuid } }
        category_uuids: { type: array, items: { type: string, format: uuid } }
        is_active: { type: [boolean, "null"] }

