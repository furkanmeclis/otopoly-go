  /v1/tenant/jobs/{uuid}/loyalty/apply:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Tenant]
      operationId: applyTenantJobLoyalty
      summary: Apply a reward / package credit / subscription use to a job line
      description: >-
        Requires `tenant.jobs.write` and `tenant.loyalty.apply`. Send one of the
        `options` of the job loyalty section. The line keeps its price; the covered
        amount becomes its `discount_amount` and the job total drops. 409
        `NOT_APPLICABLE` when the option no longer applies, `CONFLICT` when the job
        is paid / closed or the line is already covered.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoyaltyApplyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJobLoyalty"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/jobs/{uuid}/loyalty/{applicationUuid}/revert:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
      - { name: applicationUuid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Tenant]
      operationId: revertTenantJobLoyalty
      summary: Revert loyalty on a job line
      description: >-
        Requires `tenant.jobs.write` and `tenant.loyalty.apply`. The line is charged again
        and the credits / use / stamps go back. Cancelling or voiding the job does
        this for every application.
