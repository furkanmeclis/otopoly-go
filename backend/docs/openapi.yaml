      type: object
      required: [kind, uuid]
      properties:
        kind: { type: string, enum: [customer, cari, job, sale, finance_account, todo] }
        uuid: { type: string, format: uuid }

    AIActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        summary_key: { type: string }
        summary_params:
          type: object
          additionalProperties: true
        message: { type: string }
        link: { $ref: "#/components/schemas/AIActionLink" }

    AIConfirmCard:
      type: object
