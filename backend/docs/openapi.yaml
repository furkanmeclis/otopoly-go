      properties:
        provider: { type: string, enum: [anthropic, openai_compatible] }
        has_api_key: { type: boolean }
        api_key_hint: { type: string, description: "Last 4 characters of the key, prefixed with an ellipsis" }
        base_url: { type: string }
        model: { type: string }
        title_model: { type: string }
        effort: { type: string, enum: [low, medium, high, xhigh, max] }
        max_tokens: { type: integer }
        features: { $ref: "#/components/schemas/AIFeatures" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/AIToolInfo" }
        extra_instructions: { type: string }
        default_monthly_token_quota: { type: integer, format: int64, description: 0 = unlimited }
        voice: { $ref: "#/components/schemas/AIVoiceSettings" }
        configured: { type: boolean }
        updated_at: { type: string, format: date-time }

    EnvelopeAISettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AISettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PatchAISettingsRequest:
      type: object
      properties:
        provider: { type: string, enum: [anthropic, openai_compatible] }
        api_key: { type: string, writeOnly: true }
        clear_api_key: { type: boolean }
        base_url: { type: string }
        model: { type: string }
        title_model: { type: string }
        effort: { type: string, enum: [low, medium, high, xhigh, max] }
        max_tokens: { type: integer, minimum: 256, maximum: 128000 }
        features:
          type: object
          properties:
            chat: { type: boolean }
            actions: { type: boolean }
            charts: { type: boolean }
            voice: { type: boolean }
            todos: { type: boolean }
        tools:
          type: object
          description: Tool name → enabled
          additionalProperties: { type: boolean }
        extra_instructions: { type: string, maxLength: 4000 }
        default_monthly_token_quota: { type: integer, format: int64, minimum: 0 }
        voice:
          type: object
          properties:
            base_url: { type: string }
            stt_model: { type: string }
            tts_voice: { type: string }
            language: { type: string }

    AITestResult:
      type: object
      required: [ok, provider, model, latency_ms]
      properties:
        ok: { type: boolean }
        provider: { type: string }
        model: { type: string }
        latency_ms: { type: integer, format: int64 }
        message: { type: string }
        reply: { type: string }

    EnvelopeAITestResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AITestResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AITranscription:
      type: object
      required: [text, duration_seconds]
      properties:
        text: { type: string }
        language: { type: string }
        duration_seconds: { type: number }

    EnvelopeAITranscription:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AITranscription" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AISpeechRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000, description: Assistant message text (Markdown allowed) }

    AIVoiceTestRequest:
      type: object
      properties:
        base_url: { type: string }
        stt_model: { type: string }
        tts_voice: { type: string }

    AIVoiceModel:
      type: object
      required: [id]
      properties:
        id: { type: string }
        task: { type: string }

    AIVoiceTestResult:
      type: object
      required: [ok, reachable, base_url, latency_ms, stt_model, stt_model_installed, tts_model, tts_voice, tts_model_installed, installed_models]
      properties:
        ok: { type: boolean }
        reachable: { type: boolean, description: The server answered GET /v1/models }
        base_url: { type: string }
        latency_ms: { type: integer, format: int64 }
        message: { type: string }
        stt_model: { type: string }
        stt_model_installed: { type: boolean }
        tts_model: { type: string }
        tts_voice: { type: string }
        tts_model_installed: { type: boolean }
        installed_models:
          type: array
          items: { $ref: "#/components/schemas/AIVoiceModel" }

    EnvelopeAIVoiceTestResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AIVoiceTestResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AIQuota:
      type: object
      required: [limit, used, remaining, unlimited, period_start, period_end]
      properties:
        limit: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        remaining: { type: integer, format: int64 }
        unlimited: { type: boolean }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }

    AIStatus:
      type: object
      required: [available, features, quota, provider, model, tools]
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [disabled, not_configured, org_disabled, quota_exceeded] }
        features: { $ref: "#/components/schemas/AIFeatures" }
        quota: { $ref: "#/components/schemas/AIQuota" }
        provider: { type: string }
        model: { type: string }
        tools:
          type: array
          items: { type: string }

    EnvelopeAIStatus:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AIStatus" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AIConversation:
      type: object
      required: [uuid, title, message_count, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        title: { type: string }
        message_count: { type: integer }
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AIChartSeries:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }

    AIChart:
      type: object
      required: [type, title, x_key, series, rows]
      properties:
        type: { type: string, enum: [line, bar, area, pie] }
        title: { type: string }
        x_key: { type: string }
        series:
          type: array
          items: { $ref: "#/components/schemas/AIChartSeries" }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        value_format: { type: string, enum: [currency, number, percent] }
        currency: { type: string }

    AIUIBlock:
      type: object
      required: [type]
      description: |
        Chat render block. `confirm` blocks carry an AIConfirmCard in `data`
        (`id` = action uuid, `status` = pending | executing | confirmed | failed |
        cancelled | expired); `todo_list` blocks carry an AIPlan in `data` (`id` = "plan").
      properties:
        type: { type: string, description: "text | tool | chart | error | confirm | todo_list" }
        text: { type: string }
        id: { type: string }
        name: { type: string }
        status: { type: string, description: "tool: running | done | error | pending | cancelled; confirm: action status" }
        summary_key: { type: string }
        summary_params:
          type: object
          additionalProperties: true
        chart: { $ref: "#/components/schemas/AIChart" }
        code: { type: string }
        message: { type: string }
        data:
          description: AIConfirmCard for `confirm`, AIPlan for `todo_list`.
          oneOf:
            - $ref: "#/components/schemas/AIConfirmCard"
            - $ref: "#/components/schemas/AIPlan"
            - type: object
              additionalProperties: true

    AIPreviewField:
      type: object
      required: [key]
      properties:
        key: { type: string, description: "i18n key suffix under ai.confirm.fields" }
        value: { type: string }
        value_key: { type: string, description: "i18n key for the value (enums)" }

    AIEditOption:
      type: object
      required: [value]
      properties:
        value: { type: string }
        label: { type: string }
        label_key: { type: string }

    AIEditField:
      type: object
      required: [key, type, value]
      properties:
        key: { type: string }
        type: { type: string, enum: [money, text, textarea, select, date, time] }
        value: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/AIEditOption" }

    AIActionPreview:
      type: object
      required: [action, title, fields]
      properties:
        action: { type: string, description: Tool name }
        title: { type: string }
        amount: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/AIPreviewField" }
        edit:
          type: array
          items: { $ref: "#/components/schemas/AIEditField" }
        warnings:
          type: array
          items: { type: string, description: "i18n key suffix under ai.confirm.warnings" }

