  /v1/platform/organizations/{uuid}:
    get:
      tags: [Platform]
      operationId: getPlatformOrganization
      summary: Get organization
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization detail
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Platform]
      operationId: patchPlatformOrganization
      summary: Update organization
      description: |
        Requires `platform.organizations.write`. Changing `status`, `plan_code` or the access
        window additionally requires step-up verification (`403 STEP_UP_REQUIRED`);
        profile-only edits do not. `access_ends_at` is kept unless set or cleared
        (`clear_access_ends_at`). Changes are audited as `organizations.updated`.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated organization
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/organizations/{uuid}/overview:
    get:
      tags: [Platform]
      operationId: getPlatformOrganizationOverview
      summary: Organization 360° overview
      description: |
        Requires `platform.organizations.read`. One read for the platform organization
        detail: profile, record counts and last activity (`stats`), billing (live
        subscription, plan, usage vs limits incl. toggles, the 5 most recent invoices and
        orders) and WhatsApp (own-number session without pairing secrets, fallback
        setting, outbound totals of the last 30 days). `billing` / `whatsapp` are `null`
        when those modules are not wired.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          description: Organization UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrganizationOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/organizations/{uuid}/activity:
    get:
      tags: [Platform]
      operationId: listPlatformOrganizationActivity
      summary: Organization activity log
      description: |
        Requires `platform.organizations.read` and `platform.activity.read`. Audit events
        attributed to the organization (tenant actions inside it and platform actions on
        it), newest first, with the acting user.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          description: Organization UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: action
          in: query
          description: Exact action filter (e.g. `organizations.suspended`)
          schema: { type: string }
        - name: q
          in: query
          description: Substring match on action or resource
          schema: { type: string }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrganizationActivityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/organizations/{uuid}/whatsapp/outbound:
    get:
      tags: [Platform]
      operationId: listPlatformOrganizationOutbound
      summary: Organization outbound WhatsApp/SMS log
      description: |
        Requires `platform.organizations.read`. Same rows as the tenant outbound log
