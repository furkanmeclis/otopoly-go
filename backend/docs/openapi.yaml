      operationId: sendTestTenantDailySummary
      summary: Send today's summary so far to the saved recipients now (owner)
      description: >-
        Uses the saved channel. 409 `WHATSAPP_NOT_CONNECTED` / `SMS_NOT_CONFIGURED`
        when that channel cannot send, `NO_RECIPIENT_PHONE` when no recipient has a phone.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ sent, skipped[] }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/tenant/vehicle-alerts:
    get:
      tags: [Tenant]
      operationId: getTenantVehicleAlertSettings
      summary: Team vehicle alert settings (owner)
      description: >-
        Events (created/ready/delivered/cancelled), service filter (empty = all),
        recipients, phone message batch window (0 = instant, 30, 60 min), `channel`
        of the phone messages (`whatsapp` | `sms`), `whatsapp_connected`,
        `sms_available`, plus selectable members (has_phone, has_push) and
        services. In-app/push is instant; WhatsApp / SMS goes only to recipients
        web push cannot reach.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Vehicle alert settings }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Tenant]
      operationId: updateTenantVehicleAlertSettings
      summary: Save team vehicle alert settings (owner)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, events, service_uuids, recipient_user_uuids, batch_minutes]
              properties:
                enabled: { type: boolean }
                events:
                  type: array
                  items: { type: string, enum: [created, ready, delivered, cancelled] }
                service_uuids:
                  type: array
                  items: { type: string, format: uuid }
                recipient_user_uuids:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
                batch_minutes: { type: integer, enum: [0, 30, 60] }
                channel:
                  type: string
                  enum: [whatsapp, sms]
                  description: Phone message channel; omitted keeps the saved one (default whatsapp).
      responses:
        "200": { description: Saved settings }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/vehicle-alerts/test:
    post:
      tags: [Tenant]
      operationId: sendTestTenantVehicleAlert
      summary: Send a sample vehicle alert to the saved recipients (owner)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ in_app, whatsapp, sms, skipped[] }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/messaging/sms:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingSms
      summary: SMS channel providers and the organization's accounts
      description: |
        Lists the supported SMS providers (`netgsm`, `twilio`) with their credential fields and the
        organization's connected account (masked hints only, never secrets). `active_provider` is the
        provider that sends the organization's SMS ("" = SMS off). Requires `tenant.messaging.read`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsChannelOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/sms/estimate:
    post:
      tags: [Tenant]
      operationId: estimateTenantMessagingSms
      summary: Character and part estimate of an SMS text
      description: |
        GSM-7 (160 / 153 per part), Netgsm Turkish encoding (155 / 150; Netgsm messages are always sent
        with dil="TR" so they are counted at this size) or UCS-2 (70 / 67). `provider`
        defaults to the active provider (else netgsm). Requires `tenant.messaging.read`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsEstimateRequest" }
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsEstimate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/messaging/sms/{provider}:
    parameters:
      - $ref: "#/components/parameters/SmsProviderPath"
    put:
      tags: [Tenant]
      operationId: saveTenantMessagingSmsProvider
      summary: Connect or update an SMS provider account
      description: |
        Credentials are sealed per organization; empty or omitted credential values keep the stored
        ones. Netgsm: `usercode`, `password`, sender = approved message header (msgheader).
        Twilio: `account_sid`, `auth_token`, sender = From number (E.164), alphanumeric sender id or
        Messaging Service SID (`MG…`). `activate` makes it the SMS channel (default: true when no SMS
        provider is active yet); only one provider is active per organization. Changing credentials
        resets `status` to `unchecked`. Requires `tenant.messaging.write` (owner).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSmsProviderRequest" }
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsProviderAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: setTenantMessagingSmsProviderActive
      summary: Enable or disable an SMS provider as the channel
      description: Enabling one provider disables the other. Requires `tenant.messaging.write` (owner).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsProviderAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantMessagingSmsProvider
      summary: Disconnect an SMS provider (deletes its credentials)
      description: Requires `tenant.messaging.write` (owner).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ success: true }" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/messaging/sms/{provider}/test:
    parameters:
      - $ref: "#/components/parameters/SmsProviderPath"
    post:
      tags: [Tenant]
      operationId: testTenantMessagingSmsProvider
      summary: Test the SMS provider connection (sends nothing)
      description: |
        Netgsm: `POST /balance` (stip 2 TL credit, authoritative; stip 1 packages, best effort) →
        `balance` ("1.234,56 TL") and `sms_credit` (sum of SMS packages). The message header is verified
        by the test SMS (Netgsm answers 40 for an unknown header). Twilio: reads the account (and its
        balance when visible). Stores `status` (`connected` | `error`) and
        `last_error`. A failed check is still 200 with `ok: false`. Requires `tenant.messaging.write` (owner).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsTestResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/messaging/sms/{provider}/test-sms:
    parameters:
      - $ref: "#/components/parameters/SmsProviderPath"
    post:
      tags: [Tenant]
      operationId: sendTenantMessagingTestSms
      summary: Send a test SMS through a connected provider
      description: |
        Works for a connected provider whether or not it is active. The number is normalized to E.164
        (Turkish national numbers accepted); the message is logged in the outbound log
        (`event_type: sms.test`). A provider refusal is still 200 with `status: failed`. Test SMS are real
        messages: they need plan feature `sms.enabled` and are counted on `sms.monthly` (parts); a plan
        refusal is 200 with `status: failed` and `error_code` `feature_not_entitled` / `quota_exceeded`.
        Requires `tenant.messaging.write` (owner).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsTestSmsRequest" }
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsTestSmsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/messaging/sms/report:
    get:
      tags: [Platform]
      operationId: getPlatformSmsReport
      summary: Platform SMS report
      description: |
        Totals (sent / failed messages, billed parts of sent messages), the split by provider, a daily
        series (Europe/Istanbul days) and the organizations that have an SMS provider account or SMS
        traffic in the range (up to 1000), with provider, account status, counts, last send (all time) and
        the current calendar month's `sms.monthly` usage (`quota_limit` -1 = unlimited).
        Requires `platform.messaging.sms.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          description: First day (YYYY-MM-DD, inclusive). Default first day of the current month.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last day (YYYY-MM-DD, inclusive). Default today. At most 366 days after `from`.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/messaging/sms/organizations/{uuid}/messages:
    get:
      tags: [Platform]
      operationId: listPlatformSmsOrganizationMessages
      summary: An organization's recent SMS (numbers masked)
      description: Newest first. Requires `platform.messaging.sms.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSmsReportMessagesPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/messaging/session:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingSession
      summary: WhatsApp session status
      description: |
        Own-number session plus sender routing flags: `own_number_entitled`
        (plan feature `whatsapp.own_number`; without it the session is never used),
        `fallback_to_platform` and `platform_sender_available`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeWhatsAppSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantMessagingSession
      summary: Disconnect WhatsApp session
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/session/connect:
    post:
      tags: [Tenant]
      operationId: postTenantMessagingSessionConnect
      summary: Start WhatsApp QR pairing
      description: Requires plan feature `whatsapp.own_number` (403 `FEATURE_NOT_ENTITLED` otherwise).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pairing started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeWhatsAppSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not allowed, or `FEATURE_NOT_ENTITLED` when the plan excludes `whatsapp.own_number`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenant/messaging/session/settings:
    patch:
      tags: [Tenant]
      operationId: patchTenantMessagingSessionSettings
      summary: Update own-session routing settings
      description: |
        `fallback_to_platform`: send from the platform number while the own session
        is disconnected (default true). Requires `tenant.messaging.write` (owner).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchWhatsAppSessionSettingsRequest" }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeWhatsAppSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/outbound:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingOutbound
      summary: Outbound WhatsApp/SMS log
      description: Newest first, with the sender route, delivery status and error code. Requires `tenant.messaging.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Outbound page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOutboundMessagePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/rules:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingRules
      summary: List notification rules by event
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rule lists }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/rules/{event_type}/{channel}:
    patch:
      tags: [Tenant]
      operationId: patchTenantMessagingRule
      summary: Enable or disable a notification rule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_type
          in: path
          required: true
          schema: { type: string }
        - name: channel
          in: path
          required: true
          schema: { type: string, enum: [whatsapp, sms] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Rule updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/templates:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingTemplates
      summary: List message templates
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Templates }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tenant]
      operationId: postTenantMessagingTemplate
      summary: Create or upsert a message template
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, channel, body]
              properties:
                event_type: { type: string }
                channel: { type: string, enum: [whatsapp, sms] }
                locale: { type: string }
                subject: { type: string }
                body: { type: string }
                variables:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Template saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not allowed, or `FEATURE_NOT_ENTITLED` when the plan excludes `whatsapp.own_number`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenant/messaging/templates/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingTemplate
      summary: Get message template
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Template }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantMessagingTemplate
      summary: Patch message template
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                body: { type: string }
                variables:
                  type: array
                  items: { type: string }
                is_active: { type: boolean }
      responses:
        "200": { description: Template updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not allowed, or `FEATURE_NOT_ENTITLED` when the plan excludes `whatsapp.own_number`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantMessagingTemplate
      summary: Delete message template
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not allowed, or `FEATURE_NOT_ENTITLED` when the plan excludes `whatsapp.own_number`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/messaging/template-types:
    get:
      tags: [Tenant]
      operationId: getTenantMessagingTemplateTypes
      summary: Message/notification template catalog
      description: |
        Every registered template type with its channels, allowed placeholders
        (with TR/EN sample values for live preview) and the effective template
        per channel × locale (organization override or system default).
        Requires `tenant.messaging.read`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Template types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMessageTemplateTypes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/template-types/{event_type}/{channel}/{locale}:
    parameters:
      - name: event_type
        in: path
        required: true
        schema: { type: string, examples: ["quote.sent"] }
      - name: channel
        in: path
        required: true
        schema: { type: string, enum: [inapp, email, whatsapp, sms] }
      - name: locale
        in: path
        required: true
        schema: { type: string, enum: [tr, en] }
    put:
      tags: [Tenant]
      operationId: putTenantMessagingTemplateByKey
      summary: Save the organization override of a template
      description: |
        Placeholders are validated against the type registry; unknown
        `{{placeholders}}` return 400 with one `unknown_placeholder` detail each.
        Requires `tenant.messaging.write` (organization owner).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMessageTemplateRequest" }
      responses:
        "200":
          description: Saved template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMessageTemplateEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not allowed, or `FEATURE_NOT_ENTITLED` when the plan excludes `whatsapp.own_number`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Tenant]
      operationId: resetTenantMessagingTemplateByKey
      summary: Reset a template to the system default
      description: Deletes the organization override. Requires `tenant.messaging.write` (organization owner).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Default template now in effect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMessageTemplateEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not allowed, or `FEATURE_NOT_ENTITLED` when the plan excludes `whatsapp.own_number`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/notification-preferences:
    get:
      tags: [Tenant]
      operationId: getTenantNotificationPreferences
      summary: Caller's notification channels per type in this organization
      description: |
        Defaults without a saved row: in-app on, e-mail and SMS off, WhatsApp on
        only when a phone number is saved. Any organization member.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeNotificationTypePreferences" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Tenant]
      operationId: putTenantNotificationPreferences
      summary: Update notification phone and per-type channels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationTypePreferencesRequest" }
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeNotificationTypePreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

