        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant/messaging/template-types/{event_type}/{channel}/{locale}:
    parameters:
      - name: event_type
        in: path
        required: true
        schema: { type: string, examples: ["quote.sent"] }
      - name: channel
        in: path
        required: true
        schema: { type: string, enum: [inapp, email, whatsapp, sms] }
      - name: locale
        in: path
        required: true
        schema: { type: string, enum: [tr, en] }
    put:
      tags: [Tenant]
      operationId: putTenantMessagingTemplateByKey
      summary: Save the organization override of a template
      description: |
        Placeholders are validated against the type registry; unknown
        `{{placeholders}}` return 400 with one `unknown_placeholder` detail each.
        Requires `tenant.messaging.write` (organization owner).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMessageTemplateRequest" }
      responses:
        "200":
          description: Saved template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMessageTemplateEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Tenant]
      operationId: resetTenantMessagingTemplateByKey
      summary: Reset a template to the system default
      description: Deletes the organization override. Requires `tenant.messaging.write` (organization owner).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Default template now in effect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeMessageTemplateEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

