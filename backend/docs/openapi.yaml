          items: { type: string, enum: [badge, wordmark, full] }
        badge_url: { type: [string, "null"] }
        wordmark_url: { type: [string, "null"] }
        full_url: { type: [string, "null"] }
        synced_at: { type: [string, "null"], format: date-time }

    EnvelopeVehicleCatalogDisplayBrandPage:
      type: object
      required: [success, data, meta]
