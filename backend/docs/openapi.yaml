            schema:
              type: object
              required: [display_name, signature_png_base64]
              properties:
                display_name: { type: string }
                signature_png_base64: { type: string, description: Raw base64 or data URL PNG }
      responses:
        "200":
          description: Instance after sign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeContractInstance" }
        "409":
          description: Conflict (`CONFLICT`), or `OTP_REQUIRED` when the customer signer has no fresh verified OTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenant/contracts/instances/{uuid}/signers/{signerUuid}/otp:
    post:
      tags: [Tenant]
      operationId: sendTenantContractSignerOtp
      summary: Send a WhatsApp OTP (contract heading + KVKK notice) to a customer signer
      description: |
        Sends a 6-digit code over the organization's connected WhatsApp session. The message carries the
        contract title/number, plate and the KVKK (6698) disclosure. Codes expire after 5 minutes, allow
        5 attempts, can be resent after 60 seconds, and at most 5 codes per signer per hour.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: signerUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, description: Override recipient; defaults to the signer phone. }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeContractOtpChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "`OTP_CHANNEL_UNAVAILABLE` (WhatsApp not connected) or contract/signer not open"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenant/contracts/instances/{uuid}/signers/{signerUuid}/otp/verify:
    post:
      tags: [Tenant]
      operationId: verifyTenantContractSignerOtp
      summary: Verify the customer's OTP; unlocks signing for 30 minutes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: signerUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Instance after verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeContractInstance" }
        "400":
          description: "`INVALID_OTP_CODE` (wrong, expired, used, or too many attempts)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }

