        access_token_configured: { type: boolean }
        app_secret_configured: { type: boolean }
        webhook_verify_token_configured: { type: boolean }
        webhook_url:
          type: string
          description: Public URL to register as the Meta webhook callback.
        whatsmeow_status: { type: string, examples: [disconnected, qr_pending, connected, error] }
        whatsmeow_phone: { type: string }
        whatsmeow_qr_code:
          type: string
          description: Pairing QR payload while `whatsmeow_status` is `qr_pending`.
        whatsmeow_qr_expires_at: { type: string, format: date-time }
        whatsmeow_error: { type: string }
        updated_at: { type: [string, "null"], format: date-time }

    PatchWhatsAppIntegrationSettingsRequest:
      type: object
      properties:
        provider: { type: string, enum: [none, whatsmeow, cloud] }
        app_id: { type: string }
        waba_id: { type: string }
        phone_number_id: { type: string }
        api_version: { type: string, example: v26.0 }
        display_phone: { type: string }
        access_token: { type: string }
        app_secret: { type: string }
        webhook_verify_token: { type: string }

    EnvelopeWhatsAppIntegrationSettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WhatsAppIntegrationSettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    WhatsAppWebhookNotification:
      type: object
      description: Meta webhook notification (only the fields used are listed; others are ignored).
      additionalProperties: true
      properties:
        object: { type: string, example: whatsapp_business_account }
        entry:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              changes:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    field: { type: string, example: messages }
                    value: { type: object, additionalProperties: true }

    WhatsAppWebhookAck:
      type: object
      required: [received]
      properties:
        received: { type: boolean, enum: [true] }

    EnvelopeWhatsAppWebhookAck:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WhatsAppWebhookAck" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PlatformWhatsAppTestRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "905321234567" }
        template_key:
          type: string
          description: Catalog key (e.g. `job.ready`); empty sends `hello_world` / a plain test line.
        language:
          type: string
          enum: [tr, en]
          description: Catalog language of `template_key` (default `tr`).

    PlatformWhatsAppTestResult:
      type: object
      required: [sender_kind, template_name, provider_reference]
      properties:
        sender_kind: { type: string, enum: [platform_whatsmeow, platform_cloud] }
        template_name: { type: string }
        provider_reference: { type: string, description: "wamid (Cloud) or whatsmeow message id" }

    EnvelopePlatformWhatsAppTestResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PlatformWhatsAppTestResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    WhatsAppTemplate:
      type: object
      required:
        - key
        - meta_name
        - override_name
        - effective_name
        - language
        - category
        - status
        - meta_template_id
        - rejected_reason
        - last_synced_at
        - body
        - params
        - examples
        - header_document
        - copy_code_button
        - meta_category
      properties:
        key: { type: string, examples: ["job.ready"] }
        meta_name: { type: string, examples: ["otopoly_job_ready"] }
        override_name: { type: [string, "null"] }
        effective_name: { type: string }
        language:
          type: string
          enum: [tr, en]
          description: Catalog language; one item per key and language.
        category: { type: string, enum: [UTILITY, AUTHENTICATION], description: Catalog category (what is submitted). }
        meta_category:
          type: string
          description: >-
            Category Meta currently assigns to the template (from sync / submit);
            empty until known. Differs from `category` when Meta re-categorized it
            (e.g. UTILITY → MARKETING).
        status:
          type: string
          enum: [not_submitted, pending, approved, rejected, paused, disabled]
        meta_template_id: { type: string }
        rejected_reason: { type: string }
        last_synced_at: { type: [string, "null"], format: date-time }
        body: { type: string, description: "Body in `language` with positional {{1}}…{{n}} params" }
        params:
          type: array
          items: { type: string }
        examples:
          type: array
          items: { type: string }
        header_document: { type: boolean }
        copy_code_button: { type: boolean }

    WhatsAppTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WhatsAppTemplate" }

    EnvelopeWhatsAppTemplateList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WhatsAppTemplateList" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWhatsAppTemplate:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WhatsAppTemplate" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    SubmitWhatsAppTemplatesRequest:
      type: object
      properties:
        keys:
          type: array
          description: Catalog keys to submit; omitted = every entry.
          items: { type: string }
        languages:
          type: array
          description: Catalog languages to submit; omitted = every language.
          items: { type: string, enum: [tr, en] }
        resubmit:
          type: boolean
          description: >-
            With explicit `keys`: also edit templates that are already `approved`
            or `paused` in Meta with the current catalog text and category
            (they go back to review; sends use the Turkish fallback meanwhile).

    WhatsAppTemplateSubmitResult:
      type: object
      required: [key, language, status]
      properties:
        key: { type: string }
        language: { type: string, enum: [tr, en] }
        status: { type: string }
        skipped: { type: string, enum: [override, already_submitted] }
        error: { type: string, description: "Classified error code (e.g. `graph_100`)." }
        message: { type: string, description: "Meta's error text, when the Graph API returned one." }

    WhatsAppTemplateSubmit:
      type: object
      required: [results, items]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/WhatsAppTemplateSubmitResult" }
        items:
          type: array
          items: { $ref: "#/components/schemas/WhatsAppTemplate" }

    EnvelopeWhatsAppTemplateSubmit:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WhatsAppTemplateSubmit" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PatchWhatsAppTemplateRequest:
      type: object
      properties:
        override_name:
          type: [string, "null"]
          description: Meta template name (lowercase, digits, underscore); null or empty clears.

    WhatsAppSession:
      type: object
      required: [status, own_number_entitled, fallback_to_platform, platform_sender_available]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [disconnected, qr_pending, connected, error] }
        jid: { type: string }
        phone_number: { type: string }
        display_name: { type: string }
        qr_code: { type: string }
        qr_expires_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        own_number_entitled:
          type: boolean
          description: Plan includes `whatsapp.own_number`. Without it the session is kept but never used.
        fallback_to_platform:
          type: boolean
          description: Send from the platform number while the own session is disconnected.
        platform_sender_available:
          type: boolean
          description: The platform number can send right now.

    SmsProviderField:
      type: object
      required: [key, secret, required]
      properties:
        key: { type: string, description: "netgsm: usercode, password; twilio: account_sid, auth_token" }
        secret: { type: boolean }
        required: { type: boolean }

    SmsProviderAccount:
      type: object
      required: [uuid, provider, sender, is_active, status, credential_hints, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        provider: { type: string, enum: [netgsm, twilio] }
        sender: { type: string, description: Netgsm message header or Twilio From number / Messaging Service SID. }
        is_active: { type: boolean, description: This provider sends the organization's SMS. }
        status: { type: string, enum: [unchecked, connected, error], description: Last connection test. }
        last_checked_at: { type: string, format: date-time }
        last_error: { type: string }
        credential_hints:
          type: object
          additionalProperties: { type: string }
          description: Masked values per credential key (e.g. "••••••ab"); secrets are never returned.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SmsProviderEntry:
      type: object
      required: [provider, fields, sender_kind, account]
      properties:
        provider: { type: string, enum: [netgsm, twilio] }
        fields:
          type: array
          items: { $ref: "#/components/schemas/SmsProviderField" }
        sender_kind: { type: string, enum: [msgheader, from] }
        account:
          description: null when not connected.
          oneOf:
            - $ref: "#/components/schemas/SmsProviderAccount"
            - type: "null"

    SmsChannelOverview:
      type: object
      required: [active_provider, providers]
      properties:
        active_provider: { type: string, enum: ["", netgsm, twilio] }
        providers:
          type: array
          items: { $ref: "#/components/schemas/SmsProviderEntry" }

    SaveSmsProviderRequest:
      type: object
      properties:
        credentials:
          type: object
          additionalProperties: { type: string, maxLength: 256 }
          description: Field values by key; empty values keep the stored ones.
        sender: { type: string, maxLength: 64 }
        activate: { type: boolean }

    SmsSegments:
      type: object
      required: [encoding, characters, segments, per_segment, remaining]
      properties:
        encoding: { type: string, enum: [gsm7, turkish, ucs2] }
        characters: { type: integer }
        segments: { type: integer }
        per_segment: { type: integer }
        remaining: { type: integer, description: Characters left before the next part starts. }

    SmsEstimateRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        provider: { type: string, enum: [netgsm, twilio] }

    SmsEstimate:
      type: object
      required: [provider, segments]
      properties:
        provider: { type: string, enum: [netgsm, twilio] }
        segments: { $ref: "#/components/schemas/SmsSegments" }

    SmsTestResult:
      type: object
      required: [ok, account]
      properties:
        ok: { type: boolean }
        error_code: { type: string, description: "sms_auth_failed, sms_rejected, sms_unavailable, sms_outcome_unknown, …" }
        message: { type: string }
        detail: { type: string, description: Account name / matched header. }
        balance: { type: string, description: "Account credit when the provider reports it (Netgsm TL credit \"1.234,56 TL\", Twilio \"12.50 USD\")." }
        sms_credit: { type: integer, format: int64, description: Netgsm SMS package credit (sum of packages named SMS). }
        senders:
          type: array
          items: { type: string }
          description: Sender names / numbers of the account when the provider lists them.
        account: { $ref: "#/components/schemas/SmsProviderAccount" }

    SmsTestSmsRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "0532 123 45 67" }
        body: { type: string, maxLength: 1000, description: Defaults to a short Turkish test text. }

    SmsTestSmsResult:
      type: object
      required: [status, provider, recipient, segments]
      properties:
        status: { type: string, enum: [sent, failed] }
        provider: { type: string, enum: [netgsm, twilio] }
        recipient: { type: string, description: Masked E.164 number. }
        provider_message_id: { type: string }
        provider_status: { type: string }
        error_code: { type: string }
        error_message: { type: string }
        segments: { $ref: "#/components/schemas/SmsSegments" }

    SmsReportCounts:
      type: object
      required: [sent, failed, segments]
      properties:
        sent: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        segments: { type: integer, format: int64, description: Billed parts of sent messages. }

    SmsReport:
      type: object
      required: [from, to, totals, by_provider, daily, organizations]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: "#/components/schemas/SmsReportCounts" }
        by_provider:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SmsReportCounts"
              - type: object
                required: [provider]
                properties:
                  provider: { type: string, enum: [netgsm, twilio, unknown] }
        daily:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SmsReportCounts"
              - type: object
                required: [date]
                properties:
                  date: { type: string, format: date }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/SmsReportOrganization" }

    SmsReportOrganization:
      allOf:
        - $ref: "#/components/schemas/SmsReportCounts"
        - type: object
          required: [organization_uuid, organization_name, organization_slug, provider, is_active, account_status, last_sent_at, quota_used, quota_limit]
          properties:
            organization_uuid: { type: string, format: uuid }
            organization_name: { type: string }
            organization_slug: { type: string }
            provider: { type: string, enum: ["", netgsm, twilio], description: Active (else latest) SMS account. }
            is_active: { type: boolean }
            account_status: { type: string, enum: ["", unchecked, connected, error] }
            last_sent_at: { type: [string, "null"], format: date-time }
            quota_used: { type: integer, format: int64, description: sms.monthly parts used this calendar month. }
            quota_limit: { type: integer, format: int64, description: sms.monthly limit (-1 = unlimited). }

    SmsReportMessage:
      type: object
      required: [uuid, event_type, recipient, status, provider, segments, sent_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        event_type: { type: string }
        recipient: { type: string, description: Masked number. }
        status: { type: string, enum: [queued, sending, sent, failed] }
        provider: { type: string }
        provider_reference: { type: string }
        delivery_status: { type: string }
        error_code: { type: string }
        segments: { type: [integer, "null"] }
        sent_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SmsReportMessagesPage:
      type: object
      required: [organization, items, total, limit, offset]
      properties:
        organization:
          type: object
          required: [uuid, name, slug]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SmsReportMessage" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopeSmsReport:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsReport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSmsReportMessagesPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsReportMessagesPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSmsChannelOverview:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsChannelOverview" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSmsProviderAccount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsProviderAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSmsEstimate:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsEstimate" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSmsTestResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsTestResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSmsTestSmsResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SmsTestSmsResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWhatsAppSession:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WhatsAppSession" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PatchWhatsAppSessionSettingsRequest:
      type: object
      required: [fallback_to_platform]
      properties:
        fallback_to_platform: { type: boolean }

    OutboundMessage:
      type: object
      required: [uuid, event_type, channel, recipient_phone, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        event_type: { type: string }
        channel: { type: string, enum: [whatsapp, sms] }
        recipient_phone: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed] }
        provider_reference: { type: string }
        error_message: { type: string }
        subject_type: { type: string }
        subject_uuid: { type: string, format: uuid }
        sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        sender_kind: { type: string, enum: [org_own, platform_whatsmeow, platform_cloud, sms_netgsm, sms_twilio] }
        template_name: { type: string }
        delivery_status:
          type: string
          description: >-
            Cloud delivery status from the webhook (sent, delivered, read, failed), or the SMS
            provider's status at send time (Netgsm `accepted`; Twilio `queued`, `accepted`, `sent`…).
        delivery_status_at: { type: string, format: date-time }
        error_code:
          type: string
          description: >-
            Classified failure, e.g. own_session_disconnected, platform_sender_not_configured,
            platform_sender_unavailable, template_not_approved, cloud_auth_failed,
            marketing_limit, undeliverable, template_missing, graph_<code>; SMS: sms_not_configured,
            sms_auth_failed, sms_rejected, sms_unavailable, sms_outcome_unknown, invalid_recipient,
            feature_not_entitled (plan excludes sms.enabled), quota_exceeded (sms.monthly reached).
        segments: { type: integer, description: Billed SMS parts of a sent SMS (counted on the sms.monthly plan quota). }

    OutboundMessagePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OutboundMessage" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopeOutboundMessagePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OutboundMessagePage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AuthSettingsDefaultRole:
