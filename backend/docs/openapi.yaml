        name: { type: string }
        description: { type: string }
        price: { type: string, description: Price per period }
        currency: { type: string }
        period_months: { type: integer, minimum: 1, maximum: 12 }
        uses_per_period: { type: integer, minimum: 1, description: Omitted = unlimited }
        services: { type: array, items: { $ref: "#/components/schemas/LoyaltyRef" } }
        categories: { type: array, items: { $ref: "#/components/schemas/LoyaltyRef" } }
        is_active: { type: boolean }
        active_count: { type: integer, format: int64, description: Active subscriptions }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoyaltyPlanInput:
      type: object
      required: [name, price]
      description: At least one of service_uuids / category_uuids.
      properties:
