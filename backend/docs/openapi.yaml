        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/organizations/{uuid}/members:
    post:
      tags: [Platform]
      operationId: postPlatformOrganizationMember
      summary: Add organization member
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_uuid]
              properties:
                user_uuid:
                  type: string
                  format: uuid
                role:
                  type: string
      responses:
        "201":
          description: Member added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/organizations/{uuid}/members/{userUuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: Organization UUID
        schema:
          type: string
          format: uuid
      - name: userUuid
        in: path
        required: true
        description: Member user UUID
        schema:
          type: string
          format: uuid
    patch:
      tags: [Platform]
      operationId: patchPlatformOrganizationMember
      summary: Change organization member role
      description: |
        Requires `platform.organizations.write`. Switches the member between `owner` and
        `staff`; the last owner cannot be demoted (`409 LAST_ORGANIZATION_OWNER`). The
        user's global `organization_owner` role follows their owner memberships.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOrganizationMemberRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Platform]
      operationId: deletePlatformOrganizationMember
      summary: Remove organization member
      description: |
        Requires `platform.organizations.write`. The last owner cannot be removed
        (`409 LAST_ORGANIZATION_OWNER`). Refresh sessions bound to this organization are
        revoked; tenant requests fail immediately because organization membership is
        re-checked on every request. Global `organization_owner` / `organization_user`
        roles are dropped when the user has no matching memberships left.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

