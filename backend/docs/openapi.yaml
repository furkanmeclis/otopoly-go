      required: [uuid, name, slug]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    AuthSettings:
      type: object
      required:
        - registration_enabled
        - password_login_enabled
        - password_register_enabled
        - passkey_login_enabled
      properties:
        registration_enabled: { type: boolean }
        default_role:
          oneOf:
            - $ref: "#/components/schemas/AuthSettingsDefaultRole"
            - type: "null"
        password_login_enabled: { type: boolean }
        password_register_enabled: { type: boolean }
        passkey_login_enabled: { type: boolean }

    PatchAuthSettingsRequest:
      type: object
      properties:
        registration_enabled: { type: boolean }
        default_role_uuid: { type: [string, "null"], format: uuid }
        clear_default_role: { type: boolean }
        password_login_enabled: { type: boolean }
        password_register_enabled: { type: boolean }
        passkey_login_enabled: { type: boolean }

    EnvelopeAuthSettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AuthSettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PublicLegalPage:
      type: object
      required: [slug, locale, title, markdown, updated_at]
      properties:
        slug: { type: string, example: privacy }
        locale:
          type: string
          enum: [tr, en]
          description: Locale actually served (tr when the requested locale is empty).
        title: { type: string }
        markdown:
          type: string
          description: Markdown source. Clients must not render raw HTML from it.
        updated_at: { type: string, format: date-time }

    EnvelopePublicLegalPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PublicLegalPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    LegalPageEditor:
      type: object
      required: [uuid, name, email]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }

    LegalPage:
      type: object
      required: [slug, title_tr, title_en, markdown_tr, markdown_en, updated_at, updated_by]
      properties:
        slug: { type: string, example: privacy }
        title_tr: { type: string }
        title_en: { type: string }
        markdown_tr: { type: string }
        markdown_en:
          type: string
          description: Empty means the public page falls back to Turkish.
        updated_at: { type: string, format: date-time }
        updated_by:
          oneOf:
            - $ref: "#/components/schemas/LegalPageEditor"
            - type: "null"

    PatchLegalPageRequest:
      type: object
      minProperties: 1
      properties:
        title_tr: { type: string, minLength: 1, maxLength: 200 }
        title_en: { type: string, maxLength: 200 }
        markdown_tr:
          type: string
          minLength: 1
          description: At most 100 KB (UTF-8 bytes).
        markdown_en:
          type: string
          description: At most 100 KB (UTF-8 bytes). Empty falls back to Turkish.

    EnvelopeLegalPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/LegalPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    OAuthProviderSettings:
      type: object
      required: [provider, login_enabled, register_enabled, client_id, client_secret_configured]
      properties:
        provider: { type: string, enum: [google, facebook, apple] }
        login_enabled: { type: boolean }
        register_enabled: { type: boolean }
        client_id: { type: string }
        client_secret_configured: { type: boolean }
        team_id:
          type: string
          description: Apple only. Apple Developer Team ID of the signing key.
        key_id:
          type: string
          description: Apple only. Key ID of the uploaded .p8 signing key.
        private_key_configured:
          type: boolean
          description: Apple only. True when a .p8 signing key is stored (encrypted). The key is never returned.
        private_key_source:
          type: string
          enum: [db, env, none]
          description: >-
            Apple only. Signing key in use at runtime: the uploaded key (db),
            the AUTH_APPLE_* env fallback (env) or none. With a key, the web
            client_secret is generated automatically.

    PatchOAuthProviderSettingsRequest:
      type: object
      properties:
        login_enabled: { type: boolean }
        register_enabled: { type: boolean }
        client_id: { type: string }
        client_secret:
          type: string
          description: >-
            Write-only. For Apple it is optional when a signing key is
            configured (the secret is then generated from the key).
        team_id:
          type: string
          pattern: "^([A-Za-z0-9]{10})?$"
          description: Apple only. 10-character Team ID (stored upper-case).
        key_id:
          type: string
          pattern: "^([A-Za-z0-9]{10})?$"
          description: Apple only. 10-character Key ID (the KEYID in AuthKey_KEYID.p8).
        private_key:
          type: string
          writeOnly: true
          description: >-
            Apple only. Contents of the .p8 file (PEM, PKCS#8, EC P-256).
            Requires team_id and key_id (sent or already stored). Stored
            encrypted; never returned.
        remove_private_key:
          type: boolean
          description: Apple only. Deletes the stored signing key (and its key_id). Cannot be combined with private_key.

    EnvelopeOAuthProviderSettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OAuthProviderSettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PlatformAPNsActiveKey:
      type: object
      description: Credentials pushes use right now (never the key itself).
      required: [key_id, team_id, bundle_id, environment, host, key_fingerprint]
      properties:
        key_id: { type: string, example: GS6Q2FZ3PT }
        team_id: { type: string, example: ABCDE12345 }
        bundle_id: { type: string, example: com.otopoly.app }
        environment: { type: string, enum: [production, sandbox] }
        host: { type: string, example: "https://api.push.apple.com" }
        key_fingerprint: { type: string, description: Short SHA-256 hex of the public key, example: 3f9a0c1d2e4b5a69 }

    PlatformAPNsTestResult:
      type: object
      required: [ok, verdict, reason, source, environment, tested_at]
      properties:
        ok: { type: boolean, description: "true when APNs accepted key, team and topic (400 BadDeviceToken)" }
        verdict:
          type: string
          enum: [accepted, key_rejected, topic_rejected, rate_limited, rejected, unreachable, not_configured]
        status: { type: integer, description: APNs HTTP status (absent when APNs was not reached), example: 400 }
        reason: { type: string, description: APNs reason, example: BadDeviceToken }
        source: { type: string, enum: [database, env, none] }
        environment: { type: string, enum: [production, sandbox] }
        host: { type: string }
        error: { type: string, description: Transport error when unreachable }
        tested_at: { type: string, format: date-time }

    PlatformAPNsStatus:
      type: object
      required:
        [source, stored, key_id, team_id, team_id_source, effective_team_id, bundle_id, environment,
         key_fingerprint, uploaded_at, updated_at, env_configured, active, last_test]
      properties:
        source:
          type: string
          enum: [database, env, none]
          description: Where pushes take the key from (database first, env fallback).
        stored: { type: boolean, description: A key was uploaded from the panel }
        key_id: { type: string, description: Stored key id ("" when none) }
        team_id: { type: string, description: Stored team id ("" = fallback) }
        team_id_source: { type: string, enum: [database, apple_integration, env, none] }
        effective_team_id: { type: string }
        bundle_id: { type: string, example: com.otopoly.app }
        environment: { type: string, enum: [production, sandbox] }
        key_fingerprint: { type: string, description: Stored key's public-key fingerprint ("" when none) }
        uploaded_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        env_configured: { type: boolean, description: APNS_* env key present }
        active:
          oneOf:
            - $ref: "#/components/schemas/PlatformAPNsActiveKey"
            - type: "null"
        last_test:
          oneOf:
            - $ref: "#/components/schemas/PlatformAPNsTestResult"
            - type: "null"

    SavePlatformAPNsKeyRequest:
      type: object
      required: [key_id]
      properties:
        key_id: { type: string, description: 10-character key id, example: GS6Q2FZ3PT }
        team_id: { type: string, description: "Optional; empty = Apple integration team id, then APNS_TEAM_ID" }
        bundle_id: { type: string, description: "Default com.otopoly.app" }
        environment: { type: string, enum: [production, sandbox], description: Default production }
        private_key: { type: string, description: ".p8 PEM text; optional when a key is already stored" }

