        - name: status
          in: query
          schema: { type: string, enum: [draft, pending, executed, voided] }
        - name: subject_type
          in: query
          schema: { type: string, enum: [service_job] }
        - name: subject_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: customer_uuid
          in: query
          description: |
            Only contracts on this customer's service jobs (contracts are bound to
            a job; the job's customer decides). A customer of another
            organization matches nothing; a malformed uuid is `400`.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Instance page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeContractInstancePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tenant]
      operationId: createTenantContractInstance
      summary: Create instance from template bound to a subject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_uuid, subject_type, subject_uuid]
              properties:
                template_uuid: { type: string, format: uuid }
                subject_type: { type: string, enum: [service_job] }
                subject_uuid: { type: string, format: uuid }
                title: { type: string }
                defer_execute:
                  type: boolean
                  description: >-
                    Keep a contract without pending signers open so photos can be
                    attached first; call the finalize endpoint afterwards.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeContractInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

