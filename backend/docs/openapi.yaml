          format: int64
          description: null = inherit platform default; 0 = unlimited
        default_quota: { type: integer, format: int64 }
        quota: { $ref: "#/components/schemas/AIQuota" }

    EnvelopeAIOrgSettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AIOrgSettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PutAIOrgSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        monthly_token_quota:
          type: [integer, "null"]
          format: int64
          minimum: 0

    AIUsageModelRow:
      type: object
      required:
        [model, kind, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, audio_seconds, characters,
         request_count, estimated_cost_usd]
      properties:
        model: { type: string }
        kind:
          type: string
          enum: [chat, voice]
          description: "`chat` = model tokens; `voice` = Speaches speech-to-text (audio_seconds) / text-to-speech (characters)."
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        audio_seconds: { type: number, description: Transcribed audio (voice rows) }
        characters: { type: integer, format: int64, description: Synthesized characters (voice rows) }
        request_count: { type: integer, format: int64 }
        estimated_cost_usd: { type: [number, "null"] }

    AIUsageOrgRow:
      type: object
      required:
        [organization_uuid, organization_name, organization_slug, input_tokens, output_tokens, cache_read_tokens,
         cache_write_tokens, quota_tokens, request_count, stt_seconds, tts_characters, voice_request_count,
         estimated_cost_usd, enabled, quota_limit, models]
      properties:
        organization_uuid: { type: string, format: uuid }
        organization_name: { type: string }
        organization_slug: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        quota_tokens: { type: integer, format: int64, description: input + output + cache writes }
        request_count: { type: integer, format: int64, description: Model calls + voice calls }
        stt_seconds: { type: number, description: Speech-to-text audio seconds }
        tts_characters: { type: integer, format: int64, description: Text-to-speech characters }
        voice_request_count: { type: integer, format: int64 }
        estimated_cost_usd: { type: number }
        enabled: { type: boolean }
        quota_limit: { type: integer, format: int64 }
        models:
          type: array
          items: { $ref: "#/components/schemas/AIUsageModelRow" }

    AIUsageSummary:
      type: object
      required: [month, period_start, period_end, items, total_tokens, stt_seconds, tts_characters, estimated_cost_usd]
      properties:
        month: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/AIUsageOrgRow" }
        total_tokens: { type: integer, format: int64 }
        stt_seconds: { type: number }
        tts_characters: { type: integer, format: int64 }
        estimated_cost_usd: { type: number }

    EnvelopeAIUsageSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AIUsageSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
