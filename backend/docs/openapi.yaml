    EnvelopeCariSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CariSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    BulkVehicleCatalogModelRulesRequest:
      type: object
      additionalProperties: false
      required: [model_uuids]
      properties:
        model_uuids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }

    VehicleCatalogBrand:
      type: object
      description: A TSB brand (keyed by TSB code). `display_name` mirrors its display brand's name.
      required: [uuid, tsb_code, tsb_name, display_name, display_brand, category, is_active, types_count, models_count, unresolved_count, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        tsb_code: { type: string, example: "100" }
        tsb_name: { type: string, example: TOFAS-FIAT }
        display_name: { type: string, example: Fiat }
        display_brand: { $ref: "#/components/schemas/VehicleCatalogDisplayBrandRef" }
        category: { $ref: "#/components/schemas/VehicleCatalogBrandCategory" }
        is_active: { type: boolean }
        types_count: { type: integer, format: int64, description: Active types }
        models_count: { type: integer, format: int64 }
        unresolved_count: { type: integer, format: int64, description: Active types without a model }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleCatalogBrandCategory:
      type: string
      enum: [passenger, light_commercial, other]

    VehicleCatalogBulkRulesResult:
      type: object
      required: [rules_saved, types_assigned]
      properties:
        rules_saved: { type: integer }
        types_assigned: { type: integer }

    VehicleCatalogDisplayBrand:
      type: object
      required: [uuid, name, slug, logo_url, logo_badge_url, logo_wordmark_url, logo_uploaded, brand_color, motomarks, is_active, brands_count, types_count, models_count, tsb_names, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, example: Fiat }
        slug: { type: string, example: fiat }
        logo_url:
          type: [string, "null"]
          description: API-owned logo stream (`/v1/...`); never build storage URLs in the browser
        logo_badge_url: { type: [string, "null"], description: "Emblem variant (synced), falls back to the upload" }
        logo_wordmark_url: { type: [string, "null"], description: Text-only variant (synced only) }
        logo_uploaded: { type: boolean, description: "An admin upload exists (wins over synced files)" }
        brand_color: { type: [string, "null"], example: "#9B1B30" }
        motomarks: { $ref: "#/components/schemas/VehicleCatalogDisplayBrandMotomarks" }
        is_active: { type: boolean }
        brands_count: { type: integer, format: int64, description: TSB brands mapped to it }
        types_count: { type: integer, format: int64, description: Active types }
        models_count: { type: integer, format: int64, description: Grouped models }
        tsb_names:
          type: array
          items: { type: string }
        brands:
          type: array
          description: Detail only
          items: { $ref: "#/components/schemas/VehicleCatalogDisplayBrandMember" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleCatalogDisplayBrandMember:
      type: object
      required: [uuid, tsb_code, tsb_name, category, is_active, types_count]
      properties:
        uuid: { type: string, format: uuid }
        tsb_code: { type: string, example: "100" }
        tsb_name: { type: string, example: TOFAS-FIAT }
        category: { $ref: "#/components/schemas/VehicleCatalogBrandCategory" }
        is_active: { type: boolean }
        types_count: { type: integer, format: int64 }

    VehicleCatalogDisplayBrandRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, example: Fiat }
        logo_url:
          type: [string, "null"]
          description: "API-owned display brand logo stream (append `variant=badge` for the emblem); null without a logo"

    VehicleCatalogFuel:
      type: string
      enum: [petrol, diesel, hybrid, electric, lpg]

    VehicleCatalogImport:
      type: object
      required: [uuid, period, filename, status, counts, error, applied_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        period: { type: [string, "null"], example: 2026-10 }
        filename: { type: string }
        status: { $ref: "#/components/schemas/VehicleCatalogImportStatus" }
        counts: { $ref: "#/components/schemas/VehicleCatalogImportCounts" }
        diff: { $ref: "#/components/schemas/VehicleCatalogImportDiff" }
        error: { type: [string, "null"] }
        created_by_email: { type: [string, "null"] }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleCatalogImportCounts:
      type: object
      description: Dry-run counts while `ready`; what the apply changed once `applied`.
      properties:
        rows: { type: integer }
        brands_new: { type: integer }
        brands_renamed: { type: integer }
        display_brands_new: { type: integer, description: Display brands created for new TSB brands }
        models_new: { type: integer }
        types_new: { type: integer }
        types_renamed: { type: integer }
        types_reactivated: { type: integer }
        types_updated: { type: integer }
        types_deactivated: { type: integer }
        valuations_new: { type: integer }
        valuations_changed: { type: integer }
        valuations_upserted: { type: integer }
        unresolved_models: { type: integer }
        unresolved_by_category:
          type: object
          additionalProperties: { type: integer }

    VehicleCatalogImportDiff:
      type: object
      description: Up to 25 samples per change kind.
      properties:
        period_label: { type: string, example: Ekim 2026 }
        years:
          type: array
          items: { type: integer }
        new_brands:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              old_name: { type: string }
              display_name: { type: string }
              category: { type: string }
        renamed_brands:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              old_name: { type: string }
              display_name: { type: string }
              category: { type: string }
        new_models:
          type: array
          items:
            type: object
            properties:
              brand: { type: string }
              name: { type: string }
              types: { type: integer }
        new_types:
          type: array
          items: { $ref: "#/components/schemas/VehicleCatalogImportSampleType" }
        renamed_types:
          type: array
          items: { $ref: "#/components/schemas/VehicleCatalogImportSampleType" }
        deactivated_types:
          type: array
          items: { $ref: "#/components/schemas/VehicleCatalogImportSampleType" }
        reactivated_types:
          type: array
          items: { $ref: "#/components/schemas/VehicleCatalogImportSampleType" }
        unresolved_types:
          type: array
          items: { $ref: "#/components/schemas/VehicleCatalogImportSampleType" }
        changed_valuations:
          type: array
          items:
            type: object
            properties:
              brand: { type: string }
              code: { type: string }
              name: { type: string }
              year: { type: integer }
              old: { type: integer }
              new: { type: integer }
        dry_run_counts: { $ref: "#/components/schemas/VehicleCatalogImportCounts" }

    VehicleCatalogImportSampleType:
      type: object
      required: [brand, code, name]
      properties:
        brand: { type: string }
        code: { type: string }
        name: { type: string }
        old_name: { type: string }
        model: { type: string }

    VehicleCatalogImportStatus:
      type: string
      enum: [queued, processing, ready, applying, applied, failed]

    VehicleCatalogModel:
      type: object
      required: [uuid, name, source, brand, display_brand, types_count, group_size, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, example: EGEA CROSS }
        source: { $ref: "#/components/schemas/VehicleCatalogModelSource" }
        brand: { $ref: "#/components/schemas/VehicleCatalogRef" }
        display_brand: { $ref: "#/components/schemas/VehicleCatalogDisplayBrandRef" }
        types_count: { type: integer, format: int64 }
        group_size:
          type: integer
          format: int64
          description: Models with the same name under the display brand (one per TSB brand); tenants see them as one model
        rules:
          type: array
          items: { $ref: "#/components/schemas/VehicleCatalogModelRule" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleCatalogModelRef:
      type: object
      required: [uuid, name, source]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, example: EGEA CROSS }
        source: { $ref: "#/components/schemas/VehicleCatalogModelSource" }

    VehicleCatalogModelRule:
      type: object
      required: [prefix, created_at]
      properties:
        prefix: { type: string, example: EGEA CROSS }
        created_at: { type: string, format: date-time }

    VehicleCatalogModelSource:
      type: string
      enum: [auto, manual]

    VehicleCatalogNamedRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    VehicleCatalogRef:
      type: object
      required: [uuid, display_name]
      properties:
        uuid: { type: string, format: uuid }
        display_name: { type: string }
        tsb_code: { type: string }
        tsb_name: { type: string }

    VehicleCatalogTransmission:
      type: string
      enum: [manual, automatic]

    VehicleCatalogType:
      type: object
      required: [uuid, tsb_type_code, raw_name, years, suggested_transmission, suggested_fuel, first_seen_period, last_seen_period, is_active, brand, display_brand, model, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        tsb_type_code: { type: string, example: "1402" }
        raw_name: { type: string, example: EGEA CROSS STREET 1.4 FIRE 95 E6D }
        years:
          type: array
          description: Model years with a kasko value (newest first)
          items: { type: integer }
        suggested_transmission:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogTransmission"
            - type: "null"
        suggested_fuel:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogFuel"
            - type: "null"
        first_seen_period: { type: string, example: 2026-10 }
        last_seen_period: { type: string, example: 2026-10 }
        is_active: { type: boolean }
        brand: { $ref: "#/components/schemas/VehicleCatalogRef" }
        display_brand: { $ref: "#/components/schemas/VehicleCatalogDisplayBrandRef" }
        model:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogModelRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleCatalogTypeDetail:
      allOf:
        - $ref: "#/components/schemas/VehicleCatalogType"
        - type: object
          required: [brand_tsb_name, latest_period, valuations, history]
          properties:
            brand_tsb_name: { type: string }
            latest_period: { type: string, description: Empty when no value is stored }
            valuations:
              type: array
              description: Latest period, one entry per model year
              items: { $ref: "#/components/schemas/VehicleCatalogValuation" }
            history:
              type: array
              description: All stored periods, newest first
              items: { $ref: "#/components/schemas/VehicleCatalogValuation" }

    VehicleCatalogValuation:
      type: object
      required: [model_year, period, value]
      properties:
        model_year: { type: integer, example: 2024 }
        period: { type: string, example: 2026-10 }
        value: { type: number, description: Kasko value in TRY, example: 1051836 }

    CreateVehicleCatalogModelRequest:
      type: object
      additionalProperties: false
      required: [brand_uuid, name]
      properties:
        brand_uuid: { type: string, format: uuid }
        name: { type: string, minLength: 1 }

    EnvelopeVehicleCatalogBrand:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VehicleCatalogBrand" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicleCatalogBrandPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/VehicleCatalogBrand" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicleCatalogBulkRulesResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VehicleCatalogBulkRulesResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicleCatalogDisplayBrand:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VehicleCatalogDisplayBrand" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    VehicleCatalogDisplayBrandMotomarks:
      type: object
      description: Link between a display brand and the brand logo mirror.
      required: [id, match_source, match_score, suggested_id, suggested_score, synced_variants]
      properties:
        id: { type: [string, "null"], example: fiat }
        match_source: { type: string, enum: [none, auto, manual, skip] }
        match_score: { type: [number, "null"] }
        suggested_id: { type: [string, "null"], description: Best candidate below the threshold }
        suggested_score: { type: [number, "null"] }
        synced_variants:
          type: array
          items: { type: string, enum: [badge, wordmark, full] }

    VehicleCatalogBrandLogoSettings:
      type: object
      required: [base_url, token_configured, enabled, auto_match_min_score, last_run_at, last_status, last_error, sources_count, match_counts, active_run]
      properties:
        base_url: { type: string, example: https://logos.example.com }
        token_configured: { type: boolean }
        enabled: { type: boolean }
        auto_match_min_score: { type: integer, minimum: 0, maximum: 100 }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"], enum: [done, failed, null] }
        last_error: { type: [string, "null"] }
        sources_count: { type: integer, format: int64, description: Mirror brands stored }
        match_counts:
          type: object
          description: Display brands per match source
          additionalProperties: { type: integer, format: int64 }
        active_run:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogBrandLogoSyncRun"
            - type: "null"

    PatchVehicleCatalogBrandLogoSettingsRequest:
      type: object
      properties:
        base_url: { type: string }
        api_token: { type: string, description: "New token; empty string clears it" }
        enabled: { type: boolean }
        auto_match_min_score: { type: integer, minimum: 0, maximum: 100 }

    EnvelopeVehicleCatalogBrandLogoSettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VehicleCatalogBrandLogoSettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    VehicleCatalogBrandLogoSyncRun:
      type: object
      required: [uuid, status, triggered_by, started_at, finished_at, not_modified, requests, brands_seen, downloaded, matched, unmatched, error, created_at]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed] }
        triggered_by:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogNamedRef"
            - type: "null"
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        not_modified: { type: boolean, description: "The mirror answered 304; only matching ran" }
        requests: { type: integer }
        brands_seen: { type: integer }
        downloaded: { type: integer, description: Logo files copied }
        matched: { type: integer }
        unmatched: { type: integer }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    EnvelopeVehicleCatalogBrandLogoSyncRun:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VehicleCatalogBrandLogoSyncRun" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicleCatalogBrandLogoSyncRunPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/VehicleCatalogBrandLogoSyncRun" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    VehicleCatalogUnmatchedDisplayBrand:
      type: object
      required: [uuid, name, slug, is_active, types_count, logo_url, suggestion]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        types_count: { type: integer, format: int64 }
        logo_url: { type: [string, "null"] }
        suggestion:
          oneOf:
            - type: object
              required: [id, name, score]
              properties:
                id: { type: string }
                name: { type: string }
                score: { type: [number, "null"] }
            - type: "null"

    EnvelopeVehicleCatalogUnmatchedDisplayBrandPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/VehicleCatalogUnmatchedDisplayBrand" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    VehicleCatalogBrandLogoSource:
      type: object
