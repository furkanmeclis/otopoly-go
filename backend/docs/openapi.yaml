          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/vehicle-catalog/imports:
    get:
      tags: [Platform]
      operationId: getPlatformVehicleCatalogImports
      summary: List TSB list imports
      description: Sort fields `period`, `status`, `created_at`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/VehicleCatalogImportStatus" }
      responses:
        "200":
          description: Import page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleCatalogImportPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Platform]
      operationId: postPlatformVehicleCatalogImport
      summary: Upload a TSB kasko list (.xlsx) for a dry run
      description: |
        Stores the file privately in object storage and queues a dry run that
        parses it and computes the diff without changing the catalog. Poll
        `GET /v1/platform/vehicle-catalog/imports/{uuid}` until `status` is `ready`
        (or `failed`), then `POST .../apply`. The period is read from cell A1
        ("Ekim 2026" → `2026-10`) unless `period` is sent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                period:
                  type: string
                  pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
                  description: Override the period (YYYY-MM)
      responses:
        "202":
          description: Import queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleCatalogImport"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/platform/vehicle-catalog/imports/{uuid}:
    get:
      tags: [Platform]
      operationId: getPlatformVehicleCatalogImport
      summary: Get import status, counts and diff samples
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleCatalogImport"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/platform/vehicle-catalog/imports/{uuid}/apply:
    post:
      tags: [Platform]
      operationId: postPlatformVehicleCatalogImportApply
      summary: Apply a dry-run import
      description: |
        Queues the apply: one transaction upserts brands and types, creates
        auto models, deactivates types missing from the period and writes the
        period's valuations (older periods are kept). Idempotent: applying
        the same period again changes nothing. Allowed from `ready`,
        `applied` and `failed` (with a period); otherwise `409 CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "202":
          description: Apply queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleCatalogImport"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

