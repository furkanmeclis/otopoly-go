        sms: { type: boolean }

    NotificationTypePreference:
      type: object
      required: [type, channels, prefs, custom]
      properties:
        type: { type: string, examples: ["todo.reminder"] }
        channels:
          type: array
          items: { type: string, enum: [inapp, email, whatsapp, sms] }
        prefs: { $ref: "#/components/schemas/NotificationChannelPrefs" }
        custom: { type: boolean }

    NotificationTypePreferences:
      type: object
      required: [phone, types]
      properties:
        phone: { type: string, description: WhatsApp/SMS number for this organization. }
        types:
          type: array
          items: { $ref: "#/components/schemas/NotificationTypePreference" }

    UpdateNotificationTypePreferencesRequest:
      type: object
      properties:
        phone: { type: string, maxLength: 32 }
        types:
          type: array
          items:
