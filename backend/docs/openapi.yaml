        subject: { type: string }
        body: { type: string }
        is_active: { type: boolean, description: Passive templates disable the channel. }
        is_custom: { type: boolean, description: True when an organization override exists. }
        uuid: { type: string, format: uuid }
        default_subject: { type: string }
        default_body: { type: string }

    MessageTemplateType:
