        reward_type: { $ref: "#/components/schemas/LoyaltyRewardType" }
        reward_service: { $ref: "#/components/schemas/LoyaltyRef" }
        reward_value: { type: string, description: "Percent or amount (0.00 for free_service)" }
        valid_from: { type: string, format: date }
        valid_until: { type: string, format: date }
        is_active: { type: boolean }
        per_customer_limit: { type: integer, minimum: 1, description: Max rewards per customer (omitted = unlimited) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoyaltyCampaignInput:
      type: object
      required: [name, stamps_required, reward_type]
      description: At least one of service_uuids / category_uuids.
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string }
        service_uuids: { type: array, items: { type: string, format: uuid } }
        category_uuids: { type: array, items: { type: string, format: uuid } }
        stamps_required: { type: integer, minimum: 1, maximum: 100 }
        reward_type: { $ref: "#/components/schemas/LoyaltyRewardType" }
        reward_service_uuid: { type: [string, "null"], format: uuid, description: Required for free_service }
        reward_value: { type: string, description: "Required for percent (1-100) and fixed (> 0)" }
        valid_from: { type: [string, "null"], format: date }
        valid_until: { type: [string, "null"], format: date }
        is_active: { type: [boolean, "null"], description: Default true }
        per_customer_limit: { type: [integer, "null"], minimum: 1, maximum: 1000 }

