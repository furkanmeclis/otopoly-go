    post:
      tags: [Platform]
      operationId: postPlatformVehicleCatalogDisplayBrandMotomarks
      summary: Link a display brand to a mirror brand by hand, skip it, or unlink
      description: Requires `platform.vehicle_brands.write`. A manual link or skip is never overwritten by a later sync run.
      security:
