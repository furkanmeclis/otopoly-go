    EnvelopeTenantVehicleCatalogModelPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TenantVehicleCatalogModel" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantVehicleCatalogTypePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TenantVehicleCatalogType" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    # ------------------------------------------------------------ pricing

    MergeVehicleCatalogModelRequest:
      type: object
      additionalProperties: false
      required: [into_uuid]
      properties:
        into_uuid: { type: string, format: uuid }

    PatchVehicleCatalogBrandRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          description: Map to the display brand of this name (created when missing)
        display_brand_uuid:
          type: string
          format: uuid
          description: Map to an existing display brand
        category: { $ref: "#/components/schemas/VehicleCatalogBrandCategory" }
        is_active: { type: boolean }

    PatchVehicleCatalogDisplayBrandRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        is_active: { type: boolean }

    PatchVehicleCatalogModelRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        source: { $ref: "#/components/schemas/VehicleCatalogModelSource" }

    PatchVehicleCatalogTypeRequest:
      type: object
      additionalProperties: false
      properties:
        model_uuid:
          type: [string, "null"]
          format: uuid
          description: |
            Model of the same TSB brand; a model of another TSB brand of the same display brand
            assigns (creating when missing) the same-name model of the type's brand. null clears it.
        save_rule:
          type: boolean
          description: Also store a prefix rule (needs model_uuid)
        rule_prefix:
          type: string
          description: Prefix of the type name; defaults to the model name
        suggested_transmission:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogTransmission"
            - type: "null"
        suggested_fuel:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogFuel"
            - type: "null"

    TenantVehicleCatalogBrand:
      type: object
      description: A display brand (FIAT and TOFAS-FIAT are one "Fiat").
      required: [uuid, display_name, slug, category, logo_url, logo_badge_url, logo_wordmark_url, brand_color]
      properties:
        uuid: { type: string, format: uuid }
        display_name: { type: string, example: Fiat }
        slug: { type: string, example: fiat }
        category: { $ref: "#/components/schemas/VehicleCatalogBrandCategory" }
        logo_url: { type: [string, "null"], description: API-owned logo stream }
        logo_badge_url: { type: [string, "null"], description: Emblem variant for compact rows }
        logo_wordmark_url: { type: [string, "null"], description: Text-only variant for headers }
        brand_color: { type: [string, "null"] }

    TenantVehicleCatalogModel:
      type: object
      description: |
        A grouped model: models with the same name under the TSB brands of one display brand are
        listed once. `uuid` is stable (its first model) and any model uuid of the group is accepted
        by `/v1/tenant/vehicle-catalog/types`.
      required: [uuid, name, brand]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, example: EGEA CROSS }
        brand: { $ref: "#/components/schemas/VehicleCatalogRef" }

    TenantVehicleCatalogType:
      type: object
      required: [uuid, tsb_type_code, name, years, suggested_transmission, suggested_fuel, brand, model]
      properties:
        uuid: { type: string, format: uuid }
        tsb_type_code: { type: string }
        name: { type: string, example: EGEA CROSS STREET 1.4 FIRE 95 E6D }
        years:
          type: array
          items: { type: integer }
        suggested_transmission:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogTransmission"
            - type: "null"
        suggested_fuel:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogFuel"
            - type: "null"
        brand: { $ref: "#/components/schemas/VehicleCatalogRef" }
        model: { $ref: "#/components/schemas/VehicleCatalogNamedRef" }

    UnmergeVehicleCatalogDisplayBrandRequest:
      type: object
      additionalProperties: false
      required: [brand_uuid]
      properties:
        brand_uuid: { type: string, format: uuid, description: TSB brand to detach }
        name: { type: string, description: Name of the new display brand }

    InsightsMonthPoint:
      type: object
      required: [month, count, amount]
      properties:
        month: { type: string, example: "2026-10", description: YYYY-MM (UTC) }
        count: { type: integer, format: int64, description: Jobs / purchases in the month (0 where not applicable) }
        qty: { type: string, description: Quantity sold (product trend only) }
        amount: { type: string, example: "1250.00", description: "Product: revenue · service: revenue · customer: job spend · supplier: spend" }
        amount_secondary: { type: string, example: "300.00", description: "Customer trend only: product sale spend" }

    ProductSummary:
      type: object
      required: [product_uuid, currency, stock, pricing, sales, purchases, jobs]
      properties:
        product_uuid: { type: string, format: uuid }
        currency: { type: string, example: TRY }
        stock:
          type: object
          required: [tracked, quantity, min_alert, status, cost_value, sale_value, coverage_qty]
          properties:
            tracked: { type: boolean }
            quantity: { type: string, example: "12" }
            min_alert: { type: string, example: "5" }
            status: { type: string, enum: [in_stock, low_stock, out_of_stock, untracked] }
            cost_value: { type: string, example: "720.00" }
            sale_value: { type: string, example: "1200.00" }
            coverage_qty: { type: string, description: quantity - min_alert, example: "7" }
        pricing:
          type: object
          required: [cost_price, sale_price, unit_margin, margin_percent]
          properties:
            cost_price: { type: string }
            sale_price: { type: string }
            unit_margin: { type: string }
            margin_percent: { type: number, description: "unit_margin / sale_price * 100, one decimal" }
        sales:
          oneOf:
            - type: object
              required: [sale_count, sold_qty, revenue, last_sold_at, last_sale_price, monthly]
              properties:
                sale_count: { type: integer, format: int64 }
                sold_qty: { type: string }
                revenue: { type: string }
                last_sold_at: { type: [string, "null"], format: date-time }
                last_sale_price: { type: [string, "null"] }
                monthly:
                  type: array
                  items: { $ref: "#/components/schemas/InsightsMonthPoint" }
            - type: "null"
        purchases:
          oneOf:
            - type: object
              required: [purchase_count, purchased_qty, spend, avg_unit_cost, last_purchased_at, last_purchase_cost]
              properties:
                purchase_count: { type: integer, format: int64 }
                purchased_qty: { type: string }
                spend: { type: string }
                avg_unit_cost: { type: string }
                last_purchased_at: { type: [string, "null"], format: date-time }
                last_purchase_cost: { type: [string, "null"] }
            - type: "null"
        jobs:
          oneOf:
            - type: object
              required: [line_job_count, line_qty, line_revenue, consumption_job_count, consumed_qty, last_consumed_at]
              properties:
                line_job_count: { type: integer, format: int64 }
                line_qty: { type: string }
                line_revenue: { type: string }
                consumption_job_count: { type: integer, format: int64 }
                consumed_qty: { type: string }
                last_consumed_at: { type: [string, "null"], format: date-time }
            - type: "null"

    ProductMovement:
      type: object
      required: [kind, ref_uuid, status, occurred_at, party_name, party_uuid, qty, unit_price, total, currency, effective]
      properties:
        kind: { type: string, enum: [purchase, sale, job], description: "ref_uuid is the purchase, sale or job uuid" }
        ref_uuid: { type: string, format: uuid }
        status: { type: string, description: "Document status (posted / voided) or the job status" }
        occurred_at: { type: string, format: date-time }
        party_name: { type: string, description: Supplier or customer name }
        party_uuid: { type: [string, "null"], format: uuid, description: Supplier uuid (purchase) or customer uuid (sale / job) }
        plate: { type: string, description: Job plate (kind=job) }
        service_name: { type: string, description: Recipe service that consumed the product (kind=job) }
        qty: { type: string, description: "Signed quantity (+ into stock, - out of stock)", example: "-2" }
        unit_price: { type: string, description: Unit cost (purchase / job) or unit price (sale) }
        total: { type: string }
        currency: { type: string }
        effective: { type: boolean, description: false for voided documents and reverted consumptions }

    ServiceSummary:
      type: object
      required: [service_uuid, currency, pricing, usage]
      properties:
        service_uuid: { type: string, format: uuid }
        currency: { type: string }
        pricing:
          type: object
          required: [price, recipe_cost, recipe_item_count, unit_margin, margin_percent, duration_minutes]
          properties:
            price: { type: string }
            recipe_cost: { type: string, description: Sum of recipe qty x product cost price }
            recipe_item_count: { type: integer }
            unit_margin: { type: string }
            margin_percent: { type: number }
            duration_minutes: { type: integer }
        usage:
          oneOf:
            - type: object
              required: [job_count, line_count, customer_count, qty, revenue, avg_unit_price, avg_job_minutes, first_used_at, last_used_at, monthly]
              properties:
                job_count: { type: integer, format: int64 }
                line_count: { type: integer, format: int64 }
                customer_count: { type: integer, format: int64 }
                qty: { type: string }
                revenue: { type: string }
                avg_unit_price: { type: string }
                avg_job_minutes: { type: number, description: Average started → completed time of finished jobs }
                first_used_at: { type: [string, "null"], format: date-time }
                last_used_at: { type: [string, "null"], format: date-time }
                monthly:
                  type: array
                  items: { $ref: "#/components/schemas/InsightsMonthPoint" }
            - type: "null"

    ServiceJob:
      type: object
      required: [uuid, status, payment_status, started_at, completed_at, plate, vehicle_label, customer_uuid, customer_name, brand_uuid, brand_name, brand_logo_url, qty, line_total, currency]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string }
        payment_status: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        plate: { type: string }
        vehicle_label: { type: string }
        customer_uuid: { type: string, format: uuid }
        customer_name: { type: string }
        brand_uuid: { type: string, format: uuid }
        brand_name: { type: string }
        brand_logo_url: { type: [string, "null"], description: "API-owned vehicle brand logo (`?variant=badge` for the emblem)" }
        qty: { type: string }
        line_total: { type: string }
        currency: { type: string }

    CustomerSummary:
      type: object
      required: [customer_uuid, vehicle_count, total_spend, last_visit_at, jobs, sales, quotes, leads, monthly, top_services, vehicles, recent_sales]
      properties:
        customer_uuid: { type: string, format: uuid }
        vehicle_count: { type: integer }
        total_spend: { type: string }
        last_visit_at: { type: [string, "null"], format: date-time }
        jobs:
          oneOf:
            - type: object
              required: [job_count, open_job_count, unpaid_job_count, spend, unpaid_amount, first_visit_at, last_visit_at]
              properties:
                job_count: { type: integer, format: int64 }
                open_job_count: { type: integer, format: int64 }
                unpaid_job_count: { type: integer, format: int64 }
                spend: { type: string }
                unpaid_amount: { type: string }
                first_visit_at: { type: [string, "null"], format: date-time }
                last_visit_at: { type: [string, "null"], format: date-time }
            - type: "null"
        sales:
          oneOf:
            - type: object
              required: [sale_count, spend, last_sold_at]
              properties:
                sale_count: { type: integer, format: int64 }
                spend: { type: string }
                last_sold_at: { type: [string, "null"], format: date-time }
            - type: "null"
        quotes:
          oneOf:
            - type: object
              required: [quote_count, open_quote_count, accepted_quote_count]
              properties:
                quote_count: { type: integer, format: int64 }
                open_quote_count: { type: integer, format: int64 }
                accepted_quote_count: { type: integer, format: int64 }
            - type: "null"
        leads:
          oneOf:
            - type: object
              required: [lead_count, open_lead_count]
              properties:
                lead_count: { type: integer, format: int64 }
                open_lead_count: { type: integer, format: int64 }
            - type: "null"
        monthly:
          type: array
          description: amount = job spend, amount_secondary = product sale spend
          items: { $ref: "#/components/schemas/InsightsMonthPoint" }
        top_services:
          type: array
          items:
            type: object
            required: [service_uuid, name, job_count, revenue, last_used_at]
            properties:
              service_uuid: { type: [string, "null"], format: uuid }
              name: { type: string }
              job_count: { type: integer, format: int64 }
              revenue: { type: string }
              last_used_at: { type: [string, "null"], format: date-time }
        vehicles:
          type: array
          description: Per-vehicle job stats (empty without tenant.jobs.read)
          items:
            type: object
            required: [vehicle_uuid, job_count, spend, last_visit_at]
            properties:
              vehicle_uuid: { type: string, format: uuid }
              job_count: { type: integer, format: int64 }
              spend: { type: string }
              last_visit_at: { type: [string, "null"], format: date-time }
        recent_sales:
          type: array
          items:
            type: object
            required: [uuid, status, method, total_amount, currency, sold_at, line_count]
            properties:
              uuid: { type: string, format: uuid }
              status: { type: string }
              method: { type: string }
              total_amount: { type: string }
              currency: { type: string }
              sold_at: { type: string, format: date-time }
              line_count: { type: integer, format: int64 }

    SupplierSummary:
      type: object
      required: [supplier_uuid, purchases]
      properties:
        supplier_uuid: { type: string, format: uuid }
        purchases:
          oneOf:
            - type: object
              required: [purchase_count, spend, avg_purchase, product_count, first_purchased_at, last_purchased_at, monthly, top_products, recent]
              properties:
                purchase_count: { type: integer, format: int64 }
                spend: { type: string }
                avg_purchase: { type: string }
                product_count: { type: integer, format: int64 }
                first_purchased_at: { type: [string, "null"], format: date-time }
                last_purchased_at: { type: [string, "null"], format: date-time }
                monthly:
                  type: array
                  items: { $ref: "#/components/schemas/InsightsMonthPoint" }
                top_products:
                  type: array
                  items:
                    type: object
                    required: [product_uuid, name, unit, qty, spend, last_purchased_at]
                    properties:
                      product_uuid: { type: string, format: uuid }
                      name: { type: string }
                      unit: { type: string }
                      qty: { type: string }
                      spend: { type: string }
                      last_purchased_at: { type: [string, "null"], format: date-time }
                recent:
                  type: array
                  items:
                    type: object
                    required: [uuid, status, method, total_amount, currency, purchased_at, line_count]
                    properties:
                      uuid: { type: string, format: uuid }
                      status: { type: string }
                      method: { type: string }
                      total_amount: { type: string }
                      currency: { type: string }
                      purchased_at: { type: string, format: date-time }
                      line_count: { type: integer, format: int64 }
            - type: "null"

    EnvelopeProductSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ProductSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeProductMovementList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ProductMovement" }
            total: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServiceSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ServiceSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServiceJobList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ServiceJob" }
            total: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSupplierSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SupplierSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    MCPInfo:
      type: object
      required: [org_url, platform_url, issuer, scopes, can_connect_org, can_connect_platform]
      properties:
        org_url: { type: string, example: "https://app.otopoly.com/mcp/org" }
        platform_url: { type: string, example: "https://app.otopoly.com/mcp/platform" }
        issuer: { type: string }
        scopes: { type: array, items: { type: string, enum: ["mcp:read", "mcp:write"] } }
        can_connect_org: { type: boolean }
        can_connect_platform: { type: boolean }

    EnvelopeMCPInfo:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/MCPInfo" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    MCPConsentOrganization:
      type: object
      required: [uuid, slug, name, role, tool_count]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { type: string, description: "Member role: owner or staff" }
        tool_count: { type: [integer, "null"], description: Tools the user gets there with the requested scopes }

    MCPConsent:
      type: object
      required: [request_uuid, client_id, client_name, redirect_host, resource, resource_url, realm, scopes, organizations, platform_tool_count, allowed, expires_at]
      properties:
        request_uuid: { type: string, format: uuid }
        client_id: { type: string }
        client_name: { type: string }
        redirect_host: { type: string }
        resource: { type: string, enum: [/mcp/org, /mcp/platform] }
        resource_url: { type: string }
        realm: { type: string, enum: [org, platform] }
        scopes: { type: array, items: { type: string, enum: ["mcp:read", "mcp:write"] } }
