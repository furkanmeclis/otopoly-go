        channels:
          type: array
          items: { type: string, enum: [inapp, email, whatsapp, sms] }
        placeholders:
          type: array
          items: { $ref: "#/components/schemas/MessageTemplatePlaceholder" }
        templates:
          type: array
          items: { $ref: "#/components/schemas/MessageTemplateEntry" }

    SaveMessageTemplateRequest:
      type: object
