            block: { $ref: "#/components/schemas/AIUIBlock" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TodoRef:
      type: object
      required: [uuid, label]
      properties:
        uuid: { type: string, format: uuid }
        label: { type: string }

    Todo:
      type: object
      required: [uuid, title, notes, due_date, due_time, status, overdue, assignee, customer, job, lead, quote, reminder_offsets, next_reminder_at, via_ai, created_by_name, completed_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        title: { type: string }
        notes: { type: string }
        due_date: { type: [string, "null"], format: date }
        due_time: { type: [string, "null"], description: "HH:MM (Europe/Istanbul)" }
        status: { type: string, enum: [open, done] }
        overdue: { type: boolean }
        assignee:
          oneOf:
            - $ref: "#/components/schemas/TodoRef"
            - type: "null"
        customer:
          oneOf:
            - $ref: "#/components/schemas/TodoRef"
            - type: "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/TodoRef"
            - type: "null"
        lead:
          oneOf:
            - $ref: "#/components/schemas/TodoRef"
            - type: "null"
        quote:
          oneOf:
            - $ref: "#/components/schemas/TodoRef"
            - type: "null"
        reminder_offsets:
          type: array
          description: Minutes before the due moment (0 = at due time). Date-only todos are due at 09:00 Europe/Istanbul.
          items: { type: integer, minimum: 0, maximum: 43200 }
        next_reminder_at: { type: [string, "null"], format: date-time }
        via_ai: { type: boolean }
        created_by_name: { type: string }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TodoSummary:
      type: object
      required: [open, overdue, today, mine, date]
      properties:
        open: { type: integer, format: int64 }
        overdue: { type: integer, format: int64 }
        today: { type: integer, format: int64 }
        mine: { type: integer, format: int64 }
        date: { type: string, format: date }

    TodoAssignee:
      type: object
      required: [uuid, name, role]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, staff] }

    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        due_date: { type: [string, "null"], format: date }
        due_time: { type: [string, "null"], description: "HH:MM; requires due_date" }
        assignee_uuid: { type: [string, "null"], format: uuid }
        customer_uuid: { type: [string, "null"], format: uuid }
        job_uuid: { type: [string, "null"], format: uuid }
        lead_uuid: { type: [string, "null"], format: uuid }
        quote_uuid: { type: [string, "null"], format: uuid }
        reminder_offsets:
          type: array
          maxItems: 5
          description: Minutes before due (requires due_date).
          items: { type: integer, minimum: 0, maximum: 43200 }

    PatchTodoRequest:
      type: object
      description: Missing fields are kept; an empty string clears optional fields.
      properties:
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        due_date: { type: string }
        due_time: { type: string }
        assignee_uuid: { type: string }
        customer_uuid: { type: string }
        job_uuid: { type: string }
        lead_uuid: { type: string }
        quote_uuid: { type: string }
        reminder_offsets:
          type: array
          maxItems: 5
          description: Replaces the reminder set when present; [] clears.
          items: { type: integer, minimum: 0, maximum: 43200 }

    MessageTemplatePlaceholder:
